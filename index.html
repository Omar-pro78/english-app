<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA English — Omar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f0e8; --bg2:#ede8de; --surface:#ffffff; --surface2:#ede8de;
  --border:#ddd6c8; --border2:#c8c0b0;
  --accent:#c1121f; --accent2:#2d6a4f; --purple:#7c3aed; --orange:#ea6c00; --gold:#b45309; --red:#dc2626;
  --text:#1a1a18; --muted:#6b6355;
  --mono:'IBM Plex Mono',monospace; --sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 45% at 85% 5%,rgba(45,106,79,.06) 0%,transparent 55%),
             radial-gradient(ellipse 55% 40% at 5% 90%,rgba(193,18,31,.04) 0%,transparent 55%),
             radial-gradient(ellipse 50% 35% at 50% 50%,rgba(200,192,176,.3) 0%,transparent 60%);}
.shell{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;}

/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid var(--border);
  background:rgba(245,240,232,.96);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:100;}
.logo-name{font-size:1.1rem;font-weight:800;letter-spacing:-.5px;}
.logo-name em{color:var(--accent);font-style:normal;}
.logo-sub{font-family:var(--mono);font-size:.5rem;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;}
.hd-stats{display:flex;gap:8px;}
.hd-stat{display:flex;flex-direction:column;align-items:center;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-family:var(--mono);min-width:48px;}
.hd-stat .n{font-size:.9rem;font-weight:500;color:var(--accent);line-height:1;}
.hd-stat .l{font-size:.44rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px;}

/* ── NAV ── */
nav{display:none;} /* nav remplacé par home screen */

/* ── HOME SCREEN ── */
.home-screen{flex:1;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto;padding:32px 16px 60px;}
.home-title{font-family:var(--mono);font-size:.6rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:24px;text-align:center;}
.home-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:28px;}

/* Home cards — horizontal list layout */
.home-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:16px;
  padding:18px 20px;display:flex;align-items:center;gap:16px;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.home-card::after{content:'›';position:absolute;right:18px;font-size:1.1rem;
  color:var(--border2);transition:all .2s;}
.home-card:hover{transform:translateX(4px);border-color:var(--card-color,var(--accent2));}
.home-card:hover::after{color:var(--card-color,var(--accent2));right:14px;}

/* Left color bar */
.home-card-bar{width:3px;height:36px;border-radius:2px;flex-shrink:0;
  background:var(--card-color,var(--accent2));}

/* Icon */
.home-card-icon{font-size:1.5rem;flex-shrink:0;width:36px;text-align:center;}

/* Text block */
.home-card-body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.home-card-label{font-size:.88rem;font-weight:800;color:var(--text);line-height:1.2;}
.home-card-sub{font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.3px;}

/* Right: progress info */
.home-card-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;margin-right:18px;}
.home-card-count{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--card-color,var(--accent2));}
.home-card-prog{font-family:var(--mono);font-size:.52rem;color:var(--muted);}

/* Divider between content group and action group */
.home-divider{height:1px;background:var(--border);margin:6px 0 8px;}

/* ── DAILY MISSION BLOCK ── */
.daily-mission{background:var(--surface);border:1.5px solid var(--border2);border-radius:16px;
  padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden;}
.daily-mission::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(45,106,79,.06) 0%,transparent 60%);}
.dm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.dm-title{font-family:var(--mono);font-size:.58rem;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;font-weight:600;}
.dm-streak{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.65rem;font-weight:700;}
.dm-streak-fire{font-size:1.1rem;}
.dm-streak-val{color:var(--orange);}
.dm-streak-lbl{color:var(--muted);font-size:.5rem;}
.dm-progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.dm-progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.dm-progress-fill{height:100%;border-radius:3px;transition:width .5s ease;
  background:linear-gradient(90deg,var(--accent2),#52b788);}
.dm-progress-txt{font-family:var(--mono);font-size:.58rem;color:var(--muted);white-space:nowrap;}
.dm-missions{display:flex;flex-direction:column;gap:6px;}
.dm-mission-item{display:flex;align-items:center;gap:9px;font-size:.76rem;}
.dm-mission-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;transition:all .2s;}
.dm-mission-check.done{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.dm-mission-text{color:var(--text);}
.dm-mission-text.done{color:var(--muted);text-decoration:line-through;}

/* ── MAIN MISSION ── */
.dm-main-mission{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;
  border-radius:12px;background:var(--bg2);border:1px solid var(--border2);margin-bottom:0;}
.dm-main-mission.done{background:rgba(45,106,79,.08);border-color:rgba(45,106,79,.3);}
.dm-main-icon{font-size:1.3rem;flex-shrink:0;line-height:1.3;}
.dm-main-body{flex:1;}
.dm-main-title{font-size:.88rem;font-weight:800;color:var(--text);line-height:1.3;}
.dm-main-mission.done .dm-main-title{color:var(--accent2);}
.dm-main-detail{font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:3px;}
/* CTA inside mission */
.dm-cta-btn{margin-top:10px;width:100%;font-family:var(--sans);font-size:.75rem;font-weight:700;
  padding:9px 14px;border-radius:10px;border:none;background:var(--text);color:#fff;
  cursor:pointer;transition:all .18s;letter-spacing:.1px;text-align:left;}
.dm-cta-btn:hover{opacity:.88;transform:translateX(2px);}
/* Indicators row */
.dm-indicators{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.dm-ind-item{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.56rem;
  color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:4px 9px;transition:all .2s;}
.dm-ind-item.done{color:var(--accent2);border-color:rgba(45,106,79,.3);background:rgba(45,106,79,.07);}
.dm-ind-icon{font-size:.62rem;}

/* ── NEXT STEP CTA ── */
.home-cta{background:var(--text);border-radius:14px;padding:16px 20px;margin-bottom:14px;
  cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .2s;position:relative;overflow:hidden;}
.home-cta::after{content:'→';position:absolute;right:18px;font-size:1.1rem;color:rgba(255,255,255,.5);transition:all .2s;}
.home-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2);}
.home-cta:hover::after{right:14px;color:rgba(255,255,255,.9);}
.home-cta-icon{font-size:1.6rem;flex-shrink:0;}
.home-cta-body{flex:1;}
.home-cta-eyebrow{font-family:var(--mono);font-size:.5rem;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-bottom:3px;}
.home-cta-label{font-size:.9rem;font-weight:800;color:#fff;line-height:1.2;}
.home-cta-sub{font-family:var(--mono);font-size:.6rem;color:rgba(255,255,255,.6);margin-top:2px;}

/* ── STREAK MILESTONE MSG ── */
.streak-msg{text-align:center;font-family:var(--mono);font-size:.68rem;padding:8px 14px;
  border-radius:10px;margin-bottom:12px;font-weight:600;}
.streak-msg.hot{background:rgba(234,108,0,.12);border:1px solid rgba(234,108,0,.3);color:var(--orange);}
.streak-msg.fire{background:rgba(193,18,31,.1);border:1px solid rgba(193,18,31,.3);color:var(--accent);}
.streak-msg.cool{background:rgba(45,106,79,.08);border:1px solid rgba(45,106,79,.2);color:var(--accent2);}

/* ── CONFETTI OVERLAY ── */
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:9999;}

/* ── RECAP CELEBRATION ── */
.recap-celebration{text-align:center;padding:20px 0 8px;}
.recap-celebration .big-emoji{font-size:3.5rem;display:block;margin-bottom:6px;animation:popIn .4s cubic-bezier(.2,1.6,.5,1) both;}
.recap-celebration .cele-title{font-size:1.2rem;font-weight:800;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
.recap-celebration .cele-sub{font-size:.78rem;color:var(--muted);margin-top:4px;}
.recap-celebration .cele-xp{display:inline-block;background:var(--gold);color:#fff;
  font-family:var(--mono);font-size:.7rem;font-weight:700;padding:4px 14px;border-radius:99px;margin-top:10px;
  animation:popIn .5s .2s cubic-bezier(.2,1.6,.5,1) both;}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* ── MILESTONE MODAL ── */
#milestoneModal{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);padding:20px;opacity:0;
  transition:opacity .25s;pointer-events:none;}
#milestoneModal.show{opacity:1;pointer-events:all;}
.milestone-card{background:var(--surface);border-radius:24px;padding:36px 28px;max-width:340px;width:100%;
  text-align:center;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.25);
  transform:scale(.85);transition:transform .3s cubic-bezier(.2,1.4,.5,1);}
#milestoneModal.show .milestone-card{transform:scale(1);}
.mc-emoji{font-size:3.5rem;display:block;margin-bottom:12px;animation:popIn .45s .1s cubic-bezier(.2,1.6,.5,1) both;}
.mc-badge{display:inline-block;font-family:var(--mono);font-size:.56rem;letter-spacing:1.5px;
  text-transform:uppercase;padding:4px 14px;border-radius:99px;border:1.5px solid;margin-bottom:14px;}
.mc-title{font-size:1.3rem;font-weight:800;line-height:1.2;margin-bottom:8px;}
.mc-sub{font-size:.82rem;color:var(--muted);line-height:1.5;margin-bottom:22px;}
.mc-btn{width:100%;padding:13px;border-radius:12px;border:none;font-family:var(--sans);
  font-size:.85rem;font-weight:800;cursor:pointer;letter-spacing:.2px;transition:all .18s;}
.mc-btn:hover{transform:translateY(-1px);opacity:.9;}

/* Hub page (sub-module selector) */
.hub-page{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:24px 16px 60px;}
.hub-tag{display:inline-block;font-family:var(--mono);font-size:.58rem;
  border:1px solid;border-radius:6px;padding:3px 9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
.hub-title{font-size:1.1rem;font-weight:800;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.hub-subtitle{font-size:.75rem;color:var(--muted);margin-bottom:28px;}
.hub-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.hub-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:14px;
  padding:18px 20px;display:flex;align-items:center;gap:16px;
  cursor:pointer;transition:all .2s;}
.hub-card:hover{transform:translateX(4px);border-color:var(--hc-color,var(--accent2));}
.hub-card-icon{font-size:1.6rem;flex-shrink:0;}
.hub-card-info{flex:1;}
.hub-card-label{font-size:.92rem;font-weight:800;color:var(--text);margin-bottom:3px;}
.hub-card-desc{font-size:.72rem;color:var(--muted);font-family:var(--mono);}
/* Progress bar inside hub cards */
.hub-card-prog-wrap{margin-top:8px;display:flex;align-items:center;gap:8px;}
.hub-card-prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.hub-card-prog-fill{height:100%;border-radius:2px;transition:width .4s ease;}
.hub-card-prog-label{font-family:var(--mono);font-size:.5rem;color:var(--muted);white-space:nowrap;}
.hub-card-arrow{font-size:1rem;color:var(--border2);transition:color .18s;flex-shrink:0;}
.hub-card:hover .hub-card-arrow{color:var(--hc-color,var(--accent2));}
.home-back{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.65rem;
  color:var(--muted);cursor:pointer;padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--bg2);transition:color .18s;}
.home-back:hover{color:var(--text);}
.home-back svg{width:14px;height:14px;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.02);}
.nav-item.active{color:var(--text);}
.nav-item.vocab-tab.active  {border-bottom-color:var(--accent);}
.nav-item.expr-tab.active   {border-bottom-color:var(--accent2);}
.nav-item.prep-tab.active   {border-bottom-color:var(--purple);}
.nav-item.phrasal-tab.active{border-bottom-color:var(--orange);}
.nav-item.take-tab.active   {border-bottom-color:#38bdf8;}
.nav-item.grammar-tab.active{border-bottom-color:var(--gold);}
.nav-item.grammar2-tab.active{border-bottom-color:#e879f9;}
.nav-item.review-tab.active {border-bottom-color:#e8c97a;}
.nav-badge{font-family:var(--mono);font-size:.5rem;padding:2px 5px;
  border-radius:99px;background:var(--surface);border:1px solid var(--border2);color:var(--muted);}
.vocab-tab.active   .nav-badge{background:rgba(193,18,31,.2);border-color:rgba(193,18,31,.5);color:var(--accent);}
.expr-tab.active    .nav-badge{background:rgba(45,106,79,.2);border-color:rgba(45,106,79,.5);color:var(--accent2);}
.prep-tab.active    .nav-badge{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);color:var(--purple);}
.phrasal-tab.active .nav-badge{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.4);color:var(--orange);}
.take-tab.active    .nav-badge{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);color:#38bdf8;}
.grammar-tab.active .nav-badge{background:rgba(245,197,24,.15);border-color:rgba(245,197,24,.4);color:var(--gold);}
.grammar2-tab.active .nav-badge{background:rgba(232,121,249,.15);border-color:rgba(232,121,249,.4);color:#e879f9;}
.review-tab.active  .nav-badge{background:rgba(232,201,122,.15);border-color:rgba(232,201,122,.4);color:#e8c97a;}

main{flex:1;display:flex;flex-direction:column;}

/* ── SHARED WRAPPER ── */
.page{flex:1;display:flex;flex-direction:column;max-width:700px;width:100%;margin:0 auto;padding:24px 16px 60px;}

/* ── FLASHCARD ── */
.fc-progress-strip{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.fc-prog-bar{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.fc-prog-fill{height:100%;border-radius:2px;transition:width .4s ease;}
.vocab-fill  {background:linear-gradient(90deg,#c1121f,#ff4d5e);}
.expr-fill   {background:linear-gradient(90deg,#2d6a4f,#52b788);}
.prep-fill   {background:linear-gradient(90deg,var(--purple),#d89cff);}
.phrasal-fill{background:linear-gradient(90deg,var(--orange),#fbbf24);}
.take-fill   {background:linear-gradient(90deg,#38bdf8,#818cf8);}
.grammar-fill{background:linear-gradient(90deg,var(--gold),#ffe066);}
.grammar2-fill{background:linear-gradient(90deg,#e879f9,#a855f7);}
.fc-prog-txt{font-family:var(--mono);font-size:.6rem;color:var(--muted);white-space:nowrap;}

.flashcard{background:var(--surface);border:1.5px solid var(--border2);border-radius:20px;
  min-height:300px;display:flex;flex-direction:column;position:relative;overflow:hidden;
  margin-bottom:16px;transition:border-color .3s;}
.flashcard.is-ok {border-color:rgba(0,212,170,.45);}
.flashcard.is-rev{border-color:rgba(245,197,24,.45);}
.card-stripe{height:4px;width:100%;}
.flashcard:not(.is-ok):not(.is-rev) .card-stripe{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.flashcard.is-ok  .card-stripe{background:linear-gradient(90deg,#2d6a4f,#52b788);}
.flashcard.is-rev .card-stripe{background:linear-gradient(90deg,var(--gold),#ffaa00);}
.flashcard.prep-card:not(.is-ok):not(.is-rev) .card-stripe{background:linear-gradient(90deg,var(--purple),var(--accent2));}

.card-badge{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:.5rem;
  letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid;}
.badge-ok {color:#52b788;background:rgba(45,106,79,.18);border-color:rgba(45,106,79,.45);}
.badge-rev{color:var(--gold);background:rgba(245,197,24,.12);border-color:rgba(245,197,24,.35);}
.badge-new{color:var(--muted);background:rgba(160,112,96,.08);border-color:var(--border2);}

.card-body{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:28px 24px 20px;text-align:center;}
.card-num {font-family:var(--mono);font-size:.55rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.card-word{font-size:clamp(1.3rem,4vw,2rem);font-weight:800;line-height:1.2;margin-bottom:8px;color:var(--text);}
.card-trad{font-size:.9rem;color:var(--muted);font-style:italic;margin-bottom:8px;line-height:1.4;}
.card-extra{font-size:.78rem;color:var(--accent2);font-family:var(--mono);margin-bottom:16px;line-height:1.5;font-style:normal;}
.card-example{font-size:.8rem;color:rgba(26,26,24,.65);margin-bottom:4px;line-height:1.5;}
.card-example-trad{font-size:.75rem;color:var(--muted);font-style:italic;margin-bottom:16px;}

.card-audio-row{display:flex;gap:8px;justify-content:center;}
.btn-audio{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.6rem;
  padding:5px 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  cursor:pointer;color:var(--muted);transition:all .18s;}
.btn-audio:hover{background:rgba(193,18,31,.12);border-color:var(--accent);color:var(--accent);}
.btn-audio svg{width:11px;height:11px;flex-shrink:0;}

.card-footer{display:flex;gap:8px;padding:0 20px 20px;flex-wrap:wrap;justify-content:center;}
.btn-act{flex:1;min-width:120px;max-width:210px;font-family:var(--sans);font-size:.72rem;font-weight:700;
  padding:9px 12px;border-radius:10px;cursor:pointer;border:1.5px solid;transition:all .18s;letter-spacing:.1px;}
.btn-ok {background:rgba(0,212,170,.08);border-color:rgba(0,212,170,.35);color:var(--accent);}
.btn-ok:hover{background:rgba(0,212,170,.18);transform:translateY(-1px);}
.btn-ok.on{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.btn-rev{background:rgba(245,197,24,.07);border-color:rgba(245,197,24,.3);color:var(--gold);}
.btn-rev:hover{background:rgba(245,197,24,.16);transform:translateY(-1px);}
.btn-rev.on{background:var(--gold);color:var(--bg);border-color:var(--gold);}

.fc-nav{display:flex;align-items:center;gap:12px;justify-content:center;}
.btn-nav{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border2);
  cursor:pointer;color:var(--text);font-size:1rem;transition:all .18s;
  display:flex;align-items:center;justify-content:center;}
.btn-nav:hover:not(:disabled){background:var(--surface2);border-color:var(--accent);color:var(--accent);transform:scale(1.05);}
.btn-nav:disabled{opacity:.25;cursor:not-allowed;}
.nav-center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;}
.nav-pos {font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--text);}
.nav-hint{font-family:var(--mono);font-size:.5rem;color:var(--muted);letter-spacing:1px;}

.fc-review-cta{margin-top:16px;text-align:center;}
.btn-goto-rev{font-family:var(--sans);font-size:.71rem;font-weight:700;padding:8px 20px;border-radius:99px;
  background:rgba(193,18,31,.1);border:1.5px solid rgba(193,18,31,.35);color:var(--accent);
  cursor:pointer;transition:all .2s;letter-spacing:.2px;}
.btn-goto-rev:hover:not(:disabled){background:rgba(193,18,31,.2);transform:scale(1.02);}
.btn-goto-rev:disabled{opacity:.3;cursor:default;}
.rev-chip{display:inline-block;font-family:var(--mono);font-size:.56rem;background:var(--accent);
  color:#fff;border-radius:99px;padding:1px 7px;margin-left:5px;font-weight:700;}

/* ── ENRICHED FEEDBACK PANEL ── */
.fc-feedback-panel{animation:slideDown .25s cubic-bezier(.2,1,.5,1) both;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* MCQ Feedback improvements */
.mcq-feedback.ok  {border-left:3px solid #52b788;}
.mcq-feedback.fail{border-left:3px solid var(--accent);}
.sess-mcq-expl.ok  {border-left-width:3px;}
.sess-mcq-expl.fail{border-left-width:3px;}


.prep-subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
.prep-subbtn{font-family:var(--mono);font-size:.62rem;padding:6px 14px;
  border:1.5px solid var(--border2);border-radius:8px;background:transparent;
  color:var(--muted);cursor:pointer;transition:all .18s;letter-spacing:.5px;}
.prep-subbtn:hover{border-color:var(--purple);color:var(--text);}
.prep-subbtn.active{background:rgba(168,85,247,.15);border-color:var(--purple);color:var(--purple);}
.phrasal-subbtn{font-family:var(--mono);font-size:.62rem;padding:6px 14px;
  border:1.5px solid var(--border2);border-radius:8px;background:transparent;
  color:var(--muted);cursor:pointer;transition:all .18s;letter-spacing:.5px;}
.phrasal-subbtn:hover{border-color:var(--orange);color:var(--text);}
.phrasal-subbtn.active{background:rgba(249,115,22,.15);border-color:var(--orange);color:var(--orange);}

/* ── COURS VIEW ── */
.cours-view{flex:1;display:flex;flex-direction:column;max-width:700px;width:100%;margin:0 auto;padding:24px 16px 60px;}
.cours-title{font-size:1rem;font-weight:800;color:var(--purple);font-family:var(--mono);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.cours-subtitle{font-size:.75rem;color:var(--muted);margin-bottom:22px;}

.cours-table{width:100%;border-collapse:collapse;margin-bottom:28px;border-radius:12px;overflow:hidden;}
.cours-table th{background:var(--surface2);font-family:var(--mono);font-size:.6rem;
  color:var(--accent);text-transform:uppercase;letter-spacing:1px;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border2);}
.cours-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:.82rem;vertical-align:top;}
.cours-table tr:last-child td{border-bottom:none;}
.cours-table tr:hover td{background:rgba(193,18,31,.04);}
.td-prep{font-weight:800;font-size:.95rem;color:var(--text);}
.td-prep-audio{display:flex;align-items:center;gap:6px;}
.td-type{color:var(--accent);font-family:var(--mono);font-size:.7rem;}
.td-ex{color:var(--text);font-size:.82rem;}
.td-ex-audio{display:flex;align-items:center;gap:6px;}
.td-trad{color:var(--muted);font-style:italic;font-size:.78rem;}
.btn-tbl-audio{display:flex;align-items:center;background:none;border:none;cursor:pointer;
  color:var(--accent);opacity:.7;transition:opacity .15s;padding:0;flex-shrink:0;}
.btn-tbl-audio:hover{opacity:1;}
.btn-tbl-audio svg{width:13px;height:13px;}

.cours-section-tag{display:inline-block;font-family:var(--mono);font-size:.58rem;
  background:rgba(193,18,31,.15);border:1px solid rgba(193,18,31,.4);color:var(--accent);
  border-radius:6px;padding:3px 9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
.cours-section-tag.orange{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.35);color:var(--orange);}
.cours-section-tag.gold{background:rgba(245,197,24,.15);border-color:rgba(245,197,24,.35);color:var(--gold);}
.cours-title{font-size:1rem;font-weight:800;color:var(--accent);font-family:var(--mono);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.cours-title.orange{color:var(--orange);}
.cours-title.gold{color:var(--gold);}
.cours-subtitle{font-size:.75rem;color:var(--muted);margin-bottom:22px;}

/* Grammar MCQ */
.grammar-tab.active{border-bottom-color:var(--gold);}
.mcq-section{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
.mcq-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:14px;padding:20px;}
.mcq-q{font-size:.88rem;font-weight:700;margin-bottom:14px;line-height:1.4;color:var(--text);}
.mcq-q em{font-style:italic;color:var(--gold);font-size:.82rem;}
.mcq-opts{display:flex;flex-direction:column;gap:7px;}
.mcq-opt{font-family:var(--sans);font-size:.8rem;padding:9px 14px;border-radius:8px;
  background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);
  cursor:pointer;text-align:left;transition:all .18s;font-weight:600;}
.mcq-opt:hover:not(:disabled){border-color:var(--accent);background:rgba(193,18,31,.1);}
.mcq-opt.correct{background:rgba(45,106,79,.2);border-color:#52b788;color:#52b788;}
.mcq-opt.wrong{background:rgba(193,18,31,.15);border-color:var(--accent);color:var(--accent);}
.mcq-opt:disabled{cursor:default;}
.mcq-feedback{font-family:var(--mono);font-size:.7rem;margin-top:10px;padding:8px 12px;
  border-radius:8px;line-height:1.4;}
.mcq-feedback.ok  {background:rgba(45,106,79,.15);color:#52b788;}
.mcq-feedback.fail{background:rgba(193,18,31,.12);color:#ff8888;}
.mcq-score-bar{display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1.5px solid var(--border2);border-radius:12px;
  padding:14px 18px;margin-bottom:18px;}
.mcq-score-info h3{font-size:.9rem;font-weight:700;margin-bottom:2px;}
.mcq-score-info p{font-size:.65rem;color:var(--muted);font-family:var(--mono);}
.mcq-score-num{font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--gold);}
.btn-mcq-reset{font-family:var(--sans);font-size:.7rem;font-weight:700;padding:7px 16px;
  border-radius:8px;background:var(--surface2);border:1.5px solid var(--border2);
  color:var(--text);cursor:pointer;transition:all .18s;}
.btn-mcq-reset:hover{border-color:var(--accent);}

/* ── REVIEW LAUNCHER ── */
.review-section{flex:1;display:flex;flex-direction:column;max-width:580px;width:100%;margin:0 auto;padding:24px 16px 60px;}
.rl-title{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
.rl-list{display:flex;flex-direction:column;gap:10px;}
.rl-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.rl-info h3{font-size:.9rem;font-weight:700;margin-bottom:4px;}
.rl-info p{font-size:.65rem;color:var(--muted);font-family:var(--mono);}
.btn-launch{font-family:var(--sans);font-weight:700;font-size:.7rem;padding:8px 16px;
  border-radius:10px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-launch:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px);}
.btn-launch:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;transform:none;filter:none;}
.bg-green{background:var(--accent2);color:#fff;}
.bg-blue {background:#1d6fa4;color:#fff;}
.bg-purple{background:var(--purple);color:#fff;}
.bg-orange{background:var(--orange);color:#fff;}
.bg-gold {background:var(--gold);color:var(--bg);}
.bg-muted{background:var(--surface2);color:var(--text);border:1.5px solid var(--border2);}

/* ── QUIZ ── */
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.quiz-ctr{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.btn-quit{font-family:var(--mono);font-size:.6rem;color:var(--muted);background:none;
  border:1px solid var(--border2);border-radius:6px;padding:4px 10px;cursor:pointer;transition:all .15s;}
.btn-quit:hover{color:var(--red);border-color:var(--red);}
.quiz-dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border2);transition:all .25s;}
.dot.ok  {background:var(--accent);}
.dot.fail{background:var(--red);}
.dot.curr{background:var(--gold);box-shadow:0 0 7px var(--gold);transform:scale(1.2);}
.quiz-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:18px;padding:28px 24px 24px;text-align:center;}
.quiz-lbl {font-family:var(--mono);font-size:.55rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.quiz-word{font-size:clamp(1.2rem,5vw,1.8rem);font-weight:800;margin-bottom:6px;line-height:1.2;}
.quiz-cat {font-family:var(--mono);font-size:.58rem;color:var(--accent2);margin-bottom:16px;letter-spacing:1px;}
.quiz-audio-row{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
.quiz-input{width:100%;font-family:var(--mono);font-size:.92rem;font-weight:500;
  padding:12px 14px;background:var(--surface);border:2px solid var(--border2);border-radius:10px;
  color:var(--text);outline:none;text-align:center;transition:border-color .2s;margin-bottom:10px;}
.quiz-input:focus{border-color:var(--accent2);}
.quiz-input.ok  {border-color:var(--accent)!important;background:rgba(0,212,170,.07);}
.quiz-input.fail{border-color:var(--red)!important;background:rgba(255,64,96,.07);}
.quiz-feedback{min-height:26px;display:flex;align-items:center;justify-content:center;
  gap:7px;font-size:.84rem;margin-bottom:14px;}
.fb-ok  {color:var(--accent);font-weight:700;}
.fb-fail{color:var(--red);}
.fb-ans {color:var(--gold);font-family:var(--mono);font-weight:600;}
.quiz-hint{font-size:.72rem;color:var(--muted);font-style:italic;margin-bottom:10px;}
.quiz-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.btn-q{font-family:var(--sans);font-weight:700;font-size:.78rem;padding:10px 24px;
  border-radius:10px;cursor:pointer;border:none;transition:all .18s;}
.btn-q.prim{background:var(--accent);color:var(--bg);}
.btn-q.prim:hover{background:#00f2c0;transform:translateY(-1px);}
.btn-q.sec{background:var(--surface2);color:var(--text);border:1.5px solid var(--border2);}
.btn-q.sec:hover{border-color:var(--accent);}
.btn-skip{font-family:var(--mono);font-size:.56rem;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;margin-top:8px;}
.btn-skip:hover{color:var(--text);}

/* RESULTS */
.quiz-results{text-align:center;padding:16px 8px;}
.res-emoji{font-size:3rem;margin-bottom:10px;}
.res-title{font-size:1.4rem;font-weight:800;margin-bottom:6px;}
.res-sub{font-size:.78rem;color:var(--muted);margin-bottom:24px;}
.res-scores{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
.res-score{background:var(--surface);border:1.5px solid var(--border2);border-radius:12px;padding:12px 18px;min-width:80px;text-align:center;}
.res-score .n{font-family:var(--mono);font-size:1.5rem;font-weight:700;line-height:1;}
.res-score .l{font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}
.res-score.ok   .n{color:var(--accent);}
.res-score.fail .n{color:var(--red);}
.res-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.btn-res{font-family:var(--sans);font-weight:700;font-size:.78rem;padding:10px 20px;border-radius:10px;cursor:pointer;transition:all .2s;border:none;}
.btn-res.prim{background:var(--accent);color:var(--bg);}
.btn-res.prim:hover{background:#00f2c0;}
.btn-res.sec{background:var(--surface2);color:var(--text);border:1.5px solid var(--border2);}
.btn-res.sec:hover{border-color:var(--accent);}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--accent);color:var(--text);
  font-family:var(--mono);font-size:.7rem;padding:8px 18px;border-radius:10px;
  z-index:999;opacity:0;transition:all .28s ease;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .24s ease forwards;}

/* ── SPEAK & IMPROVE ── */
.speak-page{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:24px 16px 60px;}
.speak-header-tag{display:inline-block;font-family:var(--mono);font-size:.58rem;
  background:rgba(45,106,79,.12);border:1px solid rgba(45,106,79,.35);color:var(--accent2);
  border-radius:6px;padding:3px 9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
.speak-title{font-size:1rem;font-weight:800;color:var(--accent2);font-family:var(--mono);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.speak-subtitle{font-size:.75rem;color:var(--muted);margin-bottom:28px;}

.speak-mic-zone{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:28px;}
.btn-mic{width:80px;height:80px;border-radius:50%;border:2.5px solid var(--accent2);
  background:rgba(45,106,79,.08);color:var(--accent2);font-size:2rem;
  cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;
  position:relative;}
.btn-mic:hover{background:rgba(45,106,79,.16);transform:scale(1.05);}
.btn-mic.recording{background:rgba(193,18,31,.12);border-color:var(--accent);color:var(--accent);
  animation:micPulse 1.2s ease-in-out infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(193,18,31,.3);}50%{box-shadow:0 0 0 14px rgba(193,18,31,0);}}
.mic-status{font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.mic-status.active{color:var(--accent);font-weight:600;}

.speak-transcript{background:var(--surface);border:1.5px solid var(--border2);border-radius:14px;
  padding:16px 18px;margin-bottom:16px;min-height:56px;font-size:.88rem;
  color:var(--muted);font-style:italic;line-height:1.5;}
.speak-transcript.has-text{color:var(--text);font-style:normal;font-weight:600;}

.speak-feedback-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:16px;
  padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.speak-feedback-card.loading{align-items:center;padding:28px;}
.speak-loading-dot{display:flex;gap:5px;align-items:center;}
.speak-loading-dot span{width:7px;height:7px;border-radius:50%;background:var(--accent2);
  animation:dotBounce .9s ease-in-out infinite;}
.speak-loading-dot span:nth-child(2){animation-delay:.15s;}
.speak-loading-dot span:nth-child(3){animation-delay:.3s;}
@keyframes dotBounce{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-6px);opacity:1;}}

.sfb-row{display:flex;flex-direction:column;gap:4px;}
.sfb-label{font-family:var(--mono);font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}
.sfb-said{font-size:.88rem;color:var(--text);font-style:italic;padding:8px 12px;
  background:var(--bg2);border-radius:8px;border-left:3px solid var(--border2);}
.sfb-corrected{font-size:.88rem;color:var(--accent2);font-weight:700;padding:8px 12px;
  background:rgba(45,106,79,.08);border-radius:8px;border-left:3px solid var(--accent2);}
.sfb-corrected.same{color:var(--muted);font-weight:400;font-style:italic;}
.sfb-tip{font-size:.8rem;color:var(--text);padding:8px 12px;
  background:rgba(180,83,9,.06);border-radius:8px;border-left:3px solid var(--gold);}
.sfb-errors{display:flex;flex-direction:column;gap:5px;}
.sfb-error-item{font-family:var(--mono);font-size:.72rem;color:var(--accent);
  padding:5px 10px;background:rgba(193,18,31,.06);border-radius:6px;}
.speak-score{display:flex;align-items:center;gap:10px;}
.speak-score-num{font-family:var(--mono);font-size:1.6rem;font-weight:700;}
.speak-score-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.speak-score-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.speak-btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn-speak-again{font-family:var(--sans);font-size:.74rem;font-weight:700;padding:9px 18px;
  border-radius:10px;border:1.5px solid var(--accent2);background:rgba(45,106,79,.08);
  color:var(--accent2);cursor:pointer;transition:all .18s;}
.btn-speak-again:hover{background:rgba(45,106,79,.18);}
.btn-speak-play{font-family:var(--sans);font-size:.74rem;font-weight:700;padding:9px 18px;
  border-radius:10px;border:1.5px solid var(--border2);background:var(--surface2);
  color:var(--text);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;}
.btn-speak-play:hover{border-color:var(--accent2);}

.speak-prompt-zone{margin-bottom:20px;}
.speak-prompt-label{font-family:var(--mono);font-size:.58rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;}
.speak-prompt-card{background:rgba(45,106,79,.06);border:1.5px solid rgba(45,106,79,.2);
  border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.speak-prompt-text{font-size:.88rem;font-weight:700;color:var(--text);line-height:1.4;}
.btn-new-prompt{font-family:var(--mono);font-size:.6rem;padding:5px 10px;border-radius:6px;
  border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-new-prompt:hover{border-color:var(--accent2);color:var(--accent2);}

/* MOBILE */
@media(max-width:480px){
  header{padding:10px 12px;}
  .hd-stats{display:none;}
  .nav-item{font-size:.64rem;padding:10px 4px;gap:3px;}
  .page,.cours-view,.review-section{padding:16px 10px 40px;}
  .card-body{padding:20px 14px 16px;}
  .card-footer{padding:0 10px 16px;}
  .rl-card{flex-direction:column;align-items:flex-start;gap:8px;}
  .quiz-card{padding:20px 12px 18px;}
  .cours-table th,.cours-table td{padding:8px;}
}

/* ── SESSION SYSTEM ── */
.session-page{flex:1;display:flex;flex-direction:column;max-width:660px;width:100%;margin:0 auto;padding:24px 16px 60px;}

/* Launch screen */
.sess-launch{background:var(--surface);border:1.5px solid var(--border2);border-radius:20px;padding:28px 24px;margin-bottom:16px;}
.sess-launch-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.sess-launch-icon{font-size:2rem;flex-shrink:0;}
.sess-launch-title{font-size:1rem;font-weight:800;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase;}
.sess-launch-sub{font-size:.72rem;color:var(--muted);margin-top:3px;}
.sess-info-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.sess-info-chip{display:flex;flex-direction:column;align-items:center;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;min-width:80px;font-family:var(--mono);}
.sess-info-chip .n{font-size:1.1rem;font-weight:700;line-height:1;}
.sess-info-chip .l{font-size:.48rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:3px;}
.sess-btns{display:flex;flex-direction:column;gap:10px;}
.btn-sess-start{font-family:var(--sans);font-size:.82rem;font-weight:800;padding:13px 20px;border-radius:12px;border:none;cursor:pointer;transition:all .2s;letter-spacing:.2px;}
.btn-sess-start.prim{color:#fff;}
.btn-sess-start.prim:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-sess-start.sec{background:var(--surface2);color:var(--text);border:1.5px solid var(--border2);}
.btn-sess-start.sec:hover{border-color:var(--accent);}
.btn-sess-start:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none;}
.sess-resume-tag{font-family:var(--mono);font-size:.58rem;color:var(--accent2);background:rgba(45,106,79,.1);border:1px solid rgba(45,106,79,.3);border-radius:6px;padding:2px 8px;margin-left:8px;display:inline-block;vertical-align:middle;}

/* Session card (flashcard in session mode) */
.sess-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sess-batch-info{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:1px;}
.sess-batch-info strong{color:var(--text);}
.sess-prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.sess-prog-bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.sess-prog-fill{height:100%;border-radius:3px;transition:width .35s ease;}
.sess-prog-txt{font-family:var(--mono);font-size:.6rem;color:var(--muted);white-space:nowrap;}

/* MCQ session card */
.sess-mcq-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:18px;padding:24px 22px;margin-bottom:16px;}
.sess-mcq-q{font-size:.92rem;font-weight:700;line-height:1.45;margin-bottom:18px;color:var(--text);}
.sess-mcq-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.sess-mcq-opt{font-family:var(--sans);font-size:.82rem;padding:11px 16px;border-radius:10px;
  background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);
  cursor:pointer;text-align:left;transition:all .18s;font-weight:600;line-height:1.3;}
.sess-mcq-opt:hover:not(:disabled){border-color:var(--accent);background:rgba(193,18,31,.08);}
.sess-mcq-opt.correct{background:rgba(45,106,79,.18);border-color:#52b788;color:#1a4a30;}
.sess-mcq-opt.wrong{background:rgba(193,18,31,.12);border-color:var(--accent);color:#8b0000;}
.sess-mcq-opt:disabled{cursor:default;}
.sess-mcq-expl{font-family:var(--mono);font-size:.72rem;margin-top:4px;padding:10px 14px;
  border-radius:9px;line-height:1.5;}
.sess-mcq-expl.ok{background:rgba(45,106,79,.12);color:#2d6a4f;border-left:3px solid #52b788;}
.sess-mcq-expl.fail{background:rgba(193,18,31,.08);color:var(--accent);border-left:3px solid var(--accent);}

/* FC session card extra buttons */
.sess-fc-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn-sess-ok{flex:1;min-width:130px;font-family:var(--sans);font-size:.74rem;font-weight:700;
  padding:10px 14px;border-radius:10px;cursor:pointer;border:1.5px solid;transition:all .18s;}
.btn-sess-ok.idle{background:rgba(45,106,79,.08);border-color:rgba(45,106,79,.35);color:var(--accent2);}
.btn-sess-ok.idle:hover{background:rgba(45,106,79,.18);}
.btn-sess-ok.on{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.btn-sess-rev.idle{flex:1;min-width:130px;font-family:var(--sans);font-size:.74rem;font-weight:700;
  padding:10px 14px;border-radius:10px;cursor:pointer;border:1.5px solid;transition:all .18s;
  background:rgba(180,83,9,.07);border-color:rgba(180,83,9,.3);color:var(--gold);}
.btn-sess-rev.idle:hover{background:rgba(180,83,9,.16);}
.btn-sess-rev.on{flex:1;min-width:130px;font-family:var(--sans);font-size:.74rem;font-weight:700;
  padding:10px 14px;border-radius:10px;cursor:pointer;border:1.5px solid;transition:all .18s;
  background:var(--gold);color:var(--bg);border-color:var(--gold);}

/* SR 3-button grades */
.sess-sr-actions{display:flex;gap:7px;margin-top:14px;}
.btn-sr{flex:1;font-family:var(--sans);font-size:.7rem;font-weight:700;
  padding:10px 8px;border-radius:10px;cursor:pointer;border:1.5px solid;
  transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.btn-sr .sr-lbl{font-size:.7rem;font-weight:700;line-height:1;}
.btn-sr .sr-due{font-family:var(--mono);font-size:.52rem;opacity:.75;line-height:1;}
.btn-sr-hard{background:rgba(193,18,31,.08);border-color:rgba(193,18,31,.35);color:var(--accent);}
.btn-sr-hard:hover{background:rgba(193,18,31,.18);}
.btn-sr-hard.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-sr-ok{background:rgba(180,83,9,.07);border-color:rgba(180,83,9,.3);color:var(--gold);}
.btn-sr-ok:hover{background:rgba(180,83,9,.16);}
.btn-sr-ok.on{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-sr-easy{background:rgba(45,106,79,.08);border-color:rgba(45,106,79,.35);color:var(--accent2);}
.btn-sr-easy:hover{background:rgba(45,106,79,.18);}
.btn-sr-easy.on{background:var(--accent2);color:#fff;border-color:var(--accent2);}
/* SR due badge (home card + CTA) */
.sr-due-badge{display:inline-block;background:var(--accent);color:#fff;font-family:var(--mono);
  font-size:.52rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;}
.sr-due-badge.gold{background:var(--gold);}
.sr-due-badge.green{background:var(--accent2);}
.btn-sess-next{font-family:var(--sans);font-size:.78rem;font-weight:800;padding:12px 26px;
  border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;
  transition:all .2s;margin-top:14px;width:100%;}
.btn-sess-next:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-sess-next:disabled{opacity:.3;cursor:not-allowed;transform:none;filter:none;}

/* Recap screen */
.sess-recap{background:var(--surface);border:1.5px solid var(--border2);border-radius:20px;padding:28px 24px;margin-bottom:16px;}
.sess-recap-scores{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0;}
.sess-score-chip{display:flex;flex-direction:column;align-items:center;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:12px 20px;min-width:80px;font-family:var(--mono);}
.sess-score-chip .n{font-size:1.4rem;font-weight:700;line-height:1;}
.sess-score-chip .l{font-size:.48rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}
.sess-score-chip.ok .n{color:var(--accent2);}
.sess-score-chip.fail .n{color:var(--accent);}
.sess-score-chip.pct .n{color:var(--purple);}
.sess-errors-toggle{font-family:var(--mono);font-size:.66rem;color:var(--muted);background:none;border:1px solid var(--border2);border-radius:8px;padding:6px 14px;cursor:pointer;transition:all .18s;margin-bottom:12px;}
.sess-errors-toggle:hover{border-color:var(--accent);color:var(--text);}
.sess-errors-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.sess-error-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;}
.sess-error-card .ec-en{font-size:.88rem;font-weight:800;color:var(--accent);margin-bottom:3px;}
.sess-error-card .ec-fr{font-size:.78rem;color:var(--muted);font-style:italic;margin-bottom:6px;}
.sess-error-card .ec-expl{font-family:var(--mono);font-size:.68rem;color:var(--text);line-height:1.4;padding:6px 10px;background:rgba(193,18,31,.06);border-radius:6px;border-left:2px solid var(--accent);}
.sess-recap-btns{display:flex;flex-direction:column;gap:10px;}
.btn-recap{font-family:var(--sans);font-size:.8rem;font-weight:700;padding:12px 20px;border-radius:12px;cursor:pointer;transition:all .2s;border:none;text-align:center;}
.btn-recap.prim{background:var(--accent2);color:#fff;}
.btn-recap.prim:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-recap.prim:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none;}
.btn-recap.sec{background:var(--surface2);color:var(--text);border:1.5px solid var(--border2);}
.btn-recap.sec:hover{border-color:var(--accent);}
.btn-recap.restart{background:transparent;color:var(--muted);border:1.5px solid var(--border2);font-size:.72rem;}
.btn-recap.restart:hover{color:var(--text);border-color:var(--border2);}

/* ── LISTENING TEST ── */
.lt-page{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:20px 16px 60px;}
.lt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.lt-tag{font-family:var(--mono);font-size:.55rem;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 10px;border-radius:6px;border:1px solid rgba(29,111,164,.35);
  background:rgba(29,111,164,.08);color:#1d6fa4;}
.lt-prog-wrap{display:flex;align-items:center;gap:8px;}
.lt-prog-bar{width:120px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.lt-prog-fill{height:100%;background:#1d6fa4;border-radius:2px;transition:width .4s ease;}
.lt-prog-label{font-family:var(--mono);font-size:.6rem;color:var(--muted);}

.lt-card{background:var(--surface);border:1.5px solid var(--border2);border-radius:20px;overflow:hidden;margin-bottom:16px;transition:border-color .3s;}
.lt-card.answered-ok{border-color:rgba(45,106,79,.45);}
.lt-card.answered-fail{border-color:rgba(193,18,31,.45);}

.lt-img-wrap{position:relative;width:100%;background:#000;border-radius:0;}
.lt-img{width:100%;max-height:260px;object-fit:cover;display:block;}
.lt-audio-overlay{position:absolute;bottom:10px;right:12px;display:flex;gap:6px;align-items:center;}
.lt-play-btn{background:#1d6fa4;border:none;color:#fff;
  border-radius:99px;padding:11px 26px;font-family:var(--sans);font-size:.82rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;
  box-shadow:0 4px 14px rgba(29,111,164,.35);}
.lt-play-btn:hover{background:#155e8a;transform:translateY(-1px);box-shadow:0 6px 18px rgba(29,111,164,.4);}
.lt-play-btn.playing{background:#c1121f;box-shadow:0 4px 14px rgba(193,18,31,.35);}
.lt-q-num{position:absolute;top:12px;left:14px;background:rgba(0,0,0,.65);color:#fff;
  font-family:var(--mono);font-size:.65rem;font-weight:700;padding:4px 10px;
  border-radius:6px;backdrop-filter:blur(4px);letter-spacing:1px;}

.lt-body{padding:16px 18px 20px;}
.lt-consigne{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.5px;
  margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.lt-opts{display:flex;flex-direction:column;gap:8px;}
.lt-opt{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;
  background:var(--bg2);border:1.5px solid var(--border2);border-radius:12px;
  cursor:pointer;transition:all .18s;text-align:left;}
.lt-opt:hover:not(.disabled){background:rgba(29,111,164,.07);border-color:rgba(29,111,164,.4);}
.lt-opt.disabled{cursor:default;pointer-events:none;}
.lt-opt.selected-correct{background:rgba(45,106,79,.12);border-color:#52b788;}
.lt-opt.selected-wrong{background:rgba(193,18,31,.08);border-color:#c1121f;}
.lt-opt.reveal-correct{background:rgba(45,106,79,.06);border-color:rgba(45,106,79,.4);}
.lt-opt-letter{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:.7rem;font-weight:800;flex-shrink:0;transition:all .18s;margin-top:1px;}
.lt-opt.selected-correct .lt-opt-letter{background:#2d6a4f;border-color:#2d6a4f;color:#fff;}
.lt-opt.selected-wrong .lt-opt-letter{background:#c1121f;border-color:#c1121f;color:#fff;}
.lt-opt.reveal-correct .lt-opt-letter{background:rgba(45,106,79,.2);border-color:#2d6a4f;color:#2d6a4f;}
.lt-opt-text{font-size:.84rem;color:var(--text);font-weight:500;line-height:1.4;}

.lt-feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-family:var(--mono);font-size:.72rem;line-height:1.4;}
.lt-feedback.ok{background:rgba(45,106,79,.12);color:#2d6a4f;border-left:3px solid #52b788;}
.lt-feedback.fail{background:rgba(193,18,31,.08);color:#c1121f;border-left:3px solid #c1121f;}

.lt-nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.lt-btn-nav{font-family:var(--sans);font-size:.78rem;font-weight:700;padding:10px 20px;
  border-radius:10px;border:1.5px solid var(--border2);background:var(--surface);
  color:var(--text);cursor:pointer;transition:all .18s;}
.lt-btn-nav:hover{border-color:#1d6fa4;color:#1d6fa4;}
.lt-btn-nav.primary{background:#1d6fa4;border-color:#1d6fa4;color:#fff;}
.lt-btn-nav.primary:hover{background:#155e8a;}
.lt-btn-nav:disabled{opacity:.35;cursor:default;pointer-events:none;}

.lt-score-card{background:var(--surface);border:1.5px solid rgba(29,111,164,.3);
  border-radius:20px;padding:32px 24px;text-align:center;margin-bottom:16px;}
.lt-score-big{font-size:3.2rem;font-weight:900;font-family:var(--mono);color:#1d6fa4;line-height:1;}
.lt-score-sub{font-size:.8rem;color:var(--muted);margin-top:6px;margin-bottom:20px;}
.lt-score-bar-wrap{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.lt-score-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#1d6fa4,#38bdf8);transition:width .8s ease;}

/* Pulse animation for play button while speaking */
@keyframes ltPulse{0%,100%{box-shadow:0 0 0 0 rgba(193,18,31,.4);}50%{box-shadow:0 0 0 12px rgba(193,18,31,0);}}
.lt-play-btn.playing{animation:ltPulse 1.2s ease-in-out infinite;}

/* Audio centered above options */
.lt-audio-center{display:flex;justify-content:center;padding:14px 0 10px;}

/* Listening hint */
.lt-listen-hint{display:flex;align-items:center;justify-content:center;gap:7px;
  font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.3px;
  margin-bottom:14px;}
.lt-hint-icon{font-size:1.1rem;animation:hintBob .9s ease-in-out infinite;}
@keyframes hintBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

/* Big letter-only option grid: 2x2 */
.lt-opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}

.lt-opt-block{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:20px 12px;
  background:var(--bg2);border:2px solid var(--border2);border-radius:16px;
  cursor:pointer;transition:all .18s;min-height:72px;}
.lt-opt-block:hover:not(.disabled){background:rgba(29,111,164,.1);border-color:rgba(29,111,164,.5);transform:translateY(-2px);}
.lt-opt-block:active:not(.disabled){transform:scale(.96);}
.lt-opt-block.disabled{cursor:default;pointer-events:none;}

.lt-block-letter{font-family:var(--mono);font-size:1.6rem;font-weight:900;color:var(--text);
  width:44px;height:44px;border-radius:12px;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;background:var(--surface);}

.lt-opt-block.block-correct .lt-block-letter{background:#2d6a4f;border-color:#2d6a4f;color:#fff;}
.lt-opt-block.block-correct{background:rgba(45,106,79,.1);border-color:#52b788;}

.lt-opt-block.block-wrong .lt-block-letter{background:#c1121f;border-color:#c1121f;color:#fff;}
.lt-opt-block.block-wrong{background:rgba(193,18,31,.08);border-color:#c1121f;}

.lt-block-revealed{font-size:.72rem;color:var(--text);text-align:center;line-height:1.3;
  font-style:italic;padding:0 4px;max-width:140px;}

<script>
// ═══════════════════════════════════════════════════════════
// DATA — Vocabulaire IT
// ═══════════════════════════════════════════════════════════
const DATA = {

// ═══════════════════════════════════════════════════════════
// SPACED REPETITION — SM-2 Algorithm
// grade: 0 = Hard (< 4 in SM-2), 1 = Correct (4), 2 = Easy (5)
// ═══════════════════════════════════════════════════════════
function srKey(sec, idx) { return `${sec}_${idx}`; }

function srGetCard(sec, idx) {
  const key = srKey(sec, idx);
  return S.sr[key] || { interval: 0, easeFactor: 2.5, due: 0, reps: 0 };
}

function srRate(sec, idx, grade) {
  const key = srKey(sec, idx);
  const card = srGetCard(sec, idx);
  const today = Math.floor(Date.now() / 86400000); // days since epoch

  let { interval, easeFactor, reps } = card;
  // SM-2 quality: Hard=2, Correct=4, Easy=5
  const q = grade === 0 ? 2 : grade === 1 ? 4 : 5;

  if (q < 3) {
    // Failed — reset
    reps = 0;
    interval = 1;
  } else {
    if (reps === 0)      interval = 1;
    else if (reps === 1) interval = 6;
    else                 interval = Math.round(interval * easeFactor);
    reps++;
  }

  // Update ease factor
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));

  const due = today + interval;
  S.sr[key] = { interval, easeFactor, due, reps };

  // Sync legacy status: reps > 0 → ok, else → review
  if (!S.status) S.status = {};
  S.status[key] = reps > 0 ? 'ok' : 'review';
  save();
  return { interval, due };
}

function srIsDue(sec, idx) {
  const card = srGetCard(sec, idx);
  if (card.reps === 0 && card.due === 0) return true; // never seen = due
  const today = Math.floor(Date.now() / 86400000);
  return card.due <= today;
}

function srDueCount() {
  const fcSecs = ['vocab','expr','prep','phrasal','take'];
  let count = 0;
  fcSecs.forEach(sec => {
    (DATA[sec] || []).forEach((_, i) => {
      const card = srGetCard(sec, i);
      if (card.reps > 0 && srIsDue(sec, i)) count++;
    });
  });
  return count;
}

function srDueLabel(interval) {
  if (interval <= 1)  return '1j';
  if (interval <= 6)  return `${interval}j`;
  if (interval <= 30) return `${Math.round(interval/7)}sem`;
  return `${Math.round(interval/30)}mois`;
}

// Build queue: items due today (seen before) + all new items
function srDueQueue() {
  const fcSecs = ['vocab','expr','prep','phrasal','take'];
  const due = [], newItems = [];
  const today = Math.floor(Date.now() / 86400000);
  fcSecs.forEach(sec => {
    (DATA[sec] || []).forEach((item, i) => {
      const card = srGetCard(sec, i);
      const entry = { ...item, _sec: sec, _idx: i };
      if (card.reps === 0) newItems.push(entry);
      else if (card.due <= today) due.push(entry);
    });
  });
  // Due items first (shuffled), then new items (shuffled)
  return [...shuffle(due), ...shuffle(newItems)];
}

  S.tab = tab;
  const bar = document.getElementById('backBar');
  bar.style.display = 'flex';
  bar.onclick = null; // clear any previous handler
  if (HUB_TABS.has(tab)) {
    // Hub page → back to home
    bar.onclick = goHome;
    bar.querySelector ? null : null;
  } else {
    const parent = TAB_PARENT[tab];
    if (parent && HUB_TABS.has(parent)) {
      // Sub-page whose parent is a hub → back to hub
      bar.onclick = () => switchTab(parent);
    } else {
      // Sub-page with no hub parent → back to home
      bar.onclick = goHome;
    }
  }
  render();
}

function computeNextStep() {
  const MODULES = ['vocab','expr','prep','phrasal','take','grammar','grammar2','grammar3','grammar4','grammar5','grammar6'];

  // ── Contexte temporel ──────────────────────────────────────
  const now = Date.now();
  const lastTs   = S.lastSession ? S.lastSession.ts : null;
  const lastKey  = S.lastSession ? S.lastSession.moduleKey : null;
  const hoursAgo = lastTs ? (now - lastTs) / 3600000 : Infinity;
  const isAbsent = hoursAgo > 48;   // absent depuis +2 jours
  const isRecent = hoursAgo < 2;    // session il y a moins de 2h

  // ── PRIORITÉ 1 : session pausée en plein milieu d'un lot ──
  // Le dernier module touché prime sur tout le reste
  if (lastKey) {
    const cfg  = SESS_CFG[lastKey];
    const prog = S.sessProgress[lastKey];
    if (cfg && prog) {
      const data = cfg.getData();
      const pos  = prog.pos;
      // Il reste des items ET c'est en plein milieu d'un batch (pas au début d'un nouveau lot)
      const midBatch = pos % BATCH_SIZE !== 0 && pos < data.length;
      if (midBatch) {
        const batchNum = Math.floor(pos / BATCH_SIZE) + 1;
        return {
          tab: lastKey,
          icon: '▶',
          eyebrow: 'Reprends là où tu t\'es arrêté',
          label: `${cfg.label} — Lot ${batchNum}`,
          sub: `Position ${pos % BATCH_SIZE}/${BATCH_SIZE} · en cours`,
          action: () => startSession(lastKey, pos),
        };
      }
    }
  }

  // ── PRIORITÉ 2 : cartes SR dues aujourd'hui ───────────────
  const srDue = srDueCount();
  if (srDue > 0) {
    return {
      tab: 'review',
      icon: '🧠',
      eyebrow: 'Révision espacée',
      label: `${srDue} carte${srDue>1?'s':''} à revoir aujourd'hui`,
      sub: `SM-2 — renforce ta mémoire long terme`,
      action: () => { S.tab = 'review'; render(); },
    };
  }

  // ── PRIORITÉ 3 : cartes en erreur (review) ────────────────
  const rv = cntRev();
  if (rv > 0) {
    // Trouver quel module concentre le plus d'erreurs
    let worstModule = null, worstCount = 0;
    ['vocab','expr','prep','phrasal','take'].forEach(mk => {
      const c = DATA[mk] ? DATA[mk].filter((_,i) => getS(mk,i) === 'review').length : 0;
      if (c > worstCount) { worstCount = c; worstModule = mk; }
    });
    const sub = worstModule
      ? `${rv} erreur${rv>1?'s':''} · surtout en ${SESS_CFG[worstModule]?.label || worstModule}`
      : `${rv} carte${rv>1?'s':''} à revoir`;
    return {
      tab: 'review',
      icon: '🎯',
      eyebrow: 'Consolide tes points faibles',
      label: 'Révision des erreurs',
      sub,
    };
  }

  // ── PRIORITÉ 3 : lot suivant du dernier module touché ─────
  if (lastKey) {
    const cfg  = SESS_CFG[lastKey];
    const prog = S.sessProgress[lastKey];
    if (cfg && prog) {
      const data = cfg.getData();
      const pos  = prog.pos;
      if (pos > 0 && pos < data.length) {
        const batchNum = Math.floor(pos / BATCH_SIZE) + 1;
        const batchTotal = Math.ceil(data.length / BATCH_SIZE);
        const pct = Math.round((pos / data.length) * 100);
        const tone = isAbsent
          ? `Ça fait ${Math.round(hoursAgo/24)}j — reprends en douceur 👋`
          : `Lot ${batchNum}/${batchTotal} · ${pct}% complété`;
        return {
          tab: lastKey,
          icon: isAbsent ? '👋' : '▶',
          eyebrow: isAbsent ? 'Bon retour !' : 'Continue ta progression',
          label: `${cfg.label}`,
          sub: tone,
          action: () => startSession(lastKey, pos),
        };
      }
    }
  }

  // ── PRIORITÉ 4 : module le moins avancé (non terminé) ─────
  let leastModule = null, leastPct = Infinity;
  for (const mk of MODULES) {
    const cfg = SESS_CFG[mk];
    if (!cfg) continue;
    const data = cfg.getData();
    const done = cfg.type === 'fc'
      ? data.filter((_,i) => getS(mk,i) === 'ok').length
      : Object.keys(S[cfg.answersKey] || {}).length;
    const pct = data.length > 0 ? done / data.length : 1;
    if (pct < 1 && pct < leastPct) { leastPct = pct; leastModule = mk; }
  }
  if (leastModule) {
    const cfg  = SESS_CFG[leastModule];
    const prog = S.sessProgress[leastModule] || null;
    const pos  = prog ? prog.pos : 0;
    const pct  = Math.round(leastPct * 100);
    return {
      tab: leastModule,
      icon: pct === 0 ? '🆕' : '📈',
      eyebrow: pct === 0 ? 'Nouveau module' : 'Module le moins avancé',
      label: cfg.label,
      sub: pct === 0 ? `${cfg.getData().length} items · pas encore commencé` : `${pct}% complété`,
      action: () => startSession(leastModule, pos),
    };
  }

  // ── FALLBACK : tout terminé ────────────────────────────────
  return {
    tab: 'review',
    icon: '🏆',
    eyebrow: 'Tout complété !',
    label: 'Refaire un quiz complet',
    sub: 'Maintiens ton niveau',
  };
}

function computeDailyMission() {
  // Retourne 1 mission principale claire + contexte
  const rv      = cntRev();
  const srDue   = srDueCount();
  const lots    = S.daily.lotsCompleted;
  const actions = S.daily.actions;
  const goal    = S.daily.goal;

  // Cas 0 : cartes SR dues (priorité absolue)
  if (srDue > 0) {
    return {
      icon: '🧠',
      title: `${srDue} carte${srDue>1?'s':''} SR à revoir`,
      detail: 'La répétition espacée renforce la mémoire long terme',
      progress: null,
      cta: () => { S.tab = 'review'; render(); },
      ctaLabel: 'Lancer la révision SR',
    };
  }

  // Cas 1 : erreurs urgentes (priorité absolue si > 3)
  if (rv >= 3) {
    return {
      icon: '🎯',
      title: `Révise tes ${rv} erreurs`,
      detail: 'Des cartes t\'attendent — consolide avant d\'avancer',
      progress: null,
      cta: () => { S.tab = 'review'; render(); },
      ctaLabel: 'Réviser maintenant',
    };
  }

  // Cas 2 : aucun lot fait aujourd'hui → objectif = faire 1 lot
  if (lots === 0) {
    const next = computeNextStep();
    return {
      icon: '▶',
      title: 'Fais ton premier lot du jour',
      detail: '10 minutes suffisent pour progresser',
      progress: null,
      cta: next.action || (() => { if (next.tab) switchTab(next.tab); }),
      ctaLabel: 'Commencer',
    };
  }

  // Cas 3 : en cours vers l'objectif quotidien
  if (actions < goal) {
    return {
      icon: '📈',
      title: `${actions} / ${goal} actions aujourd'hui`,
      detail: `${goal - actions} de plus et ta mission est accomplie`,
      progress: { done: actions, total: goal },
      cta: null,
      ctaLabel: null,
    };
  }

  // Cas 4 : objectif atteint
  return {
    icon: '✅',
    title: 'Mission du jour accomplie !',
    detail: `${lots} lot${lots>1?'s':''} complété${lots>1?'s':''} · ${actions} actions`,
    progress: { done: goal, total: goal },
    cta: null,
    ctaLabel: null,
  };
}

function buildDailyMissions() {
  const rv      = cntRev();
  const srDue   = srDueCount();
  const lots    = S.daily.lotsCompleted;
  const actions = S.daily.actions;

// QUIZ
// ═══════════════════════════════════════════════════════════
function startQuiz(source){
  const q=revQueue(source);
  if(!q.length){toast('Rien à réviser !');return;}
  S.quiz={queue:q,idx:0,results:[],answered:false,input:'',source};
  render();
}
function startFull(){
  S.quiz={queue:fullQueue('all'),idx:0,results:[],answered:false,input:'',source:'full'};
  render();
}

function buildQuiz(){
  const q=S.quiz;
  if(q.idx>=q.queue.length) return buildResults();
  const item=q.queue[q.idx];
  const ans=q.answered, isOk=ans&&q.results[q.idx];
  const isPrep=item._sec==='prep';
  const dots=q.queue.map((_,i)=>{
    let c='dot';
    if(i<q.idx) c+=q.results[i]?' ok':' fail';
    if(i===q.idx) c+=' curr';
    return `<div class="${c}"></div>`;
  }).join('');

  // For preps: show FR usage type → write EN preposition
  // For vocab/expr: show FR → write EN
  const promptLabel = isPrep ? 'Écris la préposition anglaise →' : 'Traduis en anglais →';
  const promptWord  = isPrep ? `${item.fr}<br><span style="font-size:.75rem;color:var(--muted);font-style:italic;font-weight:400">${item.exampleTrad||''}</span>` : item.fr;
  const catLabel    = isPrep ? `📐 ${item.section}` : item._sec==='vocab'?'📚 Vocabulaire':'💬 Expression';
  const hint        = isPrep ? `<div class="quiz-hint">Exemple : <em>${item.example||''}</em></div>` : '';

  const wrap=document.createElement('div');
  wrap.className='review-section fade-up';
  wrap.innerHTML=`
    <div class="quiz-top">
      <div class="quiz-ctr">Question ${q.idx+1} / ${q.queue.length}</div>
      <button class="btn-quit" onclick="quitQuiz()">✕ Quitter</button>
    </div>
    <div class="quiz-dots">${dots}</div>
    <div class="quiz-card">
      <div class="quiz-lbl">${promptLabel}</div>
      <div class="quiz-word">${promptWord}</div>
      <div class="quiz-cat">${catLabel}</div>
      <div class="quiz-audio-row">
        <button class="btn-audio" onclick="speak('${esc(item.fr)}','fr')">${spkSvg()} FR</button>
        ${ans?`<button class="btn-audio" onclick="speak('${esc(item.en)}','en')">${spkSvg()} EN</button>`:''}
      </div>
      ${ans?'':hint}
      <input class="quiz-input ${ans?(isOk?'ok':'fail'):''}"
        id="qinput" type="text"
        placeholder="Ta réponse en anglais..."
        value="${esc(q.input)}"
        ${ans?'readonly':''}
        oninput="S.quiz.input=this.value"
        onkeydown="if(event.key==='Enter'&&!S.quiz.answered)submitQ()"
      />
      <div class="quiz-feedback">
        ${ans?(isOk
          ?`<span class="fb-ok">✓ Correct !</span>`
          :`<span class="fb-fail">✗ Incorrect —</span><span class="fb-ans">&nbsp;${item.en}</span>`):''}
      </div>
      ${ans && isOk && q.source === 'sr' ? `
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-sr btn-sr-ok" style="flex:1" onclick="srUpgradeGrade(1)"><span class="sr-lbl">🤔 Correct</span><span class="sr-due">${srDueLabel(srGetCard(item._sec,item._idx).interval||1)}</span></button>
        <button class="btn-sr btn-sr-easy" style="flex:1" onclick="srUpgradeGrade(2)"><span class="sr-lbl">😎 Facile</span><span class="sr-due">${srDueLabel(Math.round((srGetCard(item._sec,item._idx).interval||1)*srGetCard(item._sec,item._idx).easeFactor))}</span></button>
      </div>` : ''}
      <div class="quiz-btns">
        ${!ans
          ?`<button class="btn-q prim" onclick="submitQ()">Valider ↵</button>`
          :`<button class="btn-q prim" onclick="nextQ()">${q.idx+1>=q.queue.length?'Voir les résultats 🏆':'Suivant →'}</button>`
        }
      </div>
      ${!ans?`<button class="btn-skip" onclick="skipQ()">Passer ce mot →</button>`:''}
    </div>`;
  setTimeout(()=>{const i=document.getElementById('qinput');if(i&&!ans)i.focus();},40);
  return wrap;
}

function srUpgradeGrade(grade) {
  const q = S.quiz;
  const item = q.queue[q.idx];
  srRate(item._sec, item._idx, grade);
  
  render();
}

function buildResults(){
  const q=S.quiz;
  const total=q.results.length, ok=q.results.filter(Boolean).length, fail=total-ok;
  const pct=total?Math.round((ok/total)*100):0;
  let em='😅',ti='Continue !',su='Quelques erreurs — retente !';
  if(pct>=90){em='🏆';ti='Excellent !';su='Quasi parfait, bravo !';}
  else if(pct>=70){em='💪';ti='Bien joué !';su='Encore quelques à consolider.';}
  else if(pct>=50){em='📈';ti='En progrès !';su='La moitié réussie — continue !';}
  const wrap=document.createElement('div');
  wrap.className='review-section fade-up';
  wrap.innerHTML=`
    <div class="quiz-results">
      <div class="res-emoji">${em}</div>
      <div class="res-title">${ti}</div>
      <div class="res-sub">${su}</div>
      <div class="res-scores">
        <div class="res-score ok"><div class="n">${ok}</div><div class="l">Corrects</div></div>
        <div class="res-score fail"><div class="n">${fail}</div><div class="l">Erreurs</div></div>
        <div class="res-score"><div class="n">${pct}%</div><div class="l">Score</div></div>
      </div>
      <div class="res-btns">
        <button class="btn-res prim" onclick="retryFail()">🔄 Refaire les erreurs</button>
        <button class="btn-res sec" onclick="quitQuiz()">← Retour</button>
      </div>
    </div>`;
  return wrap;
}

function submitQ(){
  const q=S.quiz; if(q.answered)return;
  const inp=document.getElementById('qinput');
  const val=(inp?inp.value:q.input).trim();
  if(!val){toast('Entre une réponse !');return;}
  const item=q.queue[q.idx];
  const isOk=checkAns(val,item.en);
  q.results[q.idx]=isOk; q.answered=true;
  if(isOk){
    S.streak++;
    // For SR quiz: grade=1 (Correct); for normal quiz: use setS
    if (q.source === 'sr') {
      srRate(item._sec, item._idx, 1); // Correct
    } else {
      setS(item._sec,item._idx,'ok');
    }
    toast('✓ Bravo !');}
  else{
    S.streak=0;
    if (q.source === 'sr') {
      srRate(item._sec, item._idx, 0); // Hard
    } else {
      setS(item._sec,item._idx,'review');
    }
  }
  save(); render();
}
function skipQ(){const q=S.quiz;q.results[q.idx]=false;q.answered=true;q.input='';render();}
function nextQ(){S.quiz.idx++;S.quiz.answered=false;S.quiz.input='';render();}
function retryFail(){
  const q=S.quiz;
  const failed=q.queue.filter((_,i)=>!q.results[i]);
  if(!failed.length){quitQuiz();return;}
  S.quiz={queue:shuffle(failed),idx:0,results:[],answered:false,input:'',source:q.source};
  render();
}
function quitQuiz(){S.quiz=null;render();}

function buildMcqBlock(qcmData, answersKey, resetFn, answerFn, title, color) {
  const answers = S[answersKey] || {};
  const answered = Object.keys(answers).length;
  const correct  = Object.entries(answers).filter(([i,v])=>parseInt(v)===qcmData[i].ans).length;
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="mcq-score-bar">
      <div class="mcq-score-info">
        <h3>✅ QCM — ${title}</h3>
        <p>${answered} / ${qcmData.length} répondues · ${qcmData.length-answered} restantes</p>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="mcq-score-num" style="color:${color}">${answered>0?correct+'/'+answered:'—'}</div>
        ${answered>0?`<button class="btn-mcq-reset" onclick="${resetFn}()">🔄 Reset</button>`:''}
      </div>
    </div>
  `;
  const list = document.createElement('div');
  list.className = 'mcq-section';
  qcmData.forEach((q,qi) => {
    const chosen = answers.hasOwnProperty(qi) ? parseInt(answers[qi]) : null;
    const isAnswered = chosen !== null;
    const isCorrect  = chosen === q.ans;
    const card = document.createElement('div');
    card.className = 'mcq-card';
    card.innerHTML = `
      <div class="mcq-q">Q${qi+1}. ${q.q}</div>
      <div class="mcq-opts">
        ${q.opts.map((opt,oi)=>{
          let cls='mcq-opt';
          if(isAnswered){if(oi===q.ans)cls+=' correct';else if(oi===chosen&&!isCorrect)cls+=' wrong';}
          return `<button class="${cls}" ${isAnswered?'disabled':''} onclick="${answerFn}(${qi},${oi})">
            ${isAnswered?(oi===q.ans?'✓ ':oi===chosen&&!isCorrect?'✗ ':''):''}${opt}
          </button>`;
        }).join('')}
      </div>
      ${isAnswered?`<div class="mcq-feedback ${isCorrect?'ok':'fail'}">
        ${isCorrect
          ? `<span style="font-weight:700;">✓ Correct</span> — ${q.expl}`
          : `<div style="margin-bottom:6px;"><span style="font-weight:700;">✗ Incorrect</span> — bonne réponse : <strong style="color:#52b788;">"${q.opts[q.ans]}"</strong></div>
             <div style="font-size:.68rem;line-height:1.5;color:var(--text);background:var(--surface);border-radius:6px;padding:7px 10px;border-left:3px solid #52b788;">💡 ${q.expl}</div>`
        }
      </div>`:''}
    `;
    list.appendChild(card);
  });
  div.appendChild(list);
  return div;
}

const GRAMMAR6_QCM = [
  {
    q: "______ of classical ballet in the United States began around 1830.",
    blank: "______",
    opts: ["To teach", "Is teaching", "It was taught", "The teaching"],
    ans: 3,
    exp: "On a besoin d'un sujet nominal pour cette phrase. \"The teaching\" (gérondif nominalisé) fonctionne comme sujet de \"began\"."
  },
  {
    q: "Mason bees are solitary bees, which means ______ in colonies like honeybees or bumblebees.",
    blank: "______",
    opts: ["do not live", "when they do not live", "that they do not live", "that do not live"],
    ans: 2,
    exp: "\"Which means\" introduit une proposition complétive avec \"that\" + sujet (they) + verbe. \"That they do not live\" est la seule option grammaticalement complète."
  },
  {
    q: "Long before the advent of written literature, ______ their myths and stories in oral poems told by successive generations.",
    blank: "______",
    opts: ["people recorded", "recording people", "people's recordings", "people who recorded"],
    ans: 0,
    exp: "La phrase principale a besoin d'un sujet + verbe conjugué. \"People recorded\" (sujet + verbe au passé) complète la phrase correctement."
  },
  {
    q: "Comparative anatomy is ______ classification of both plants and animals.",
    blank: "______",
    opts: ["the basis for", "for basics", "the basis that", "the basically"],
    ans: 0,
    exp: "\"The basis for\" est l'expression correcte : \"the basis for + nom\". Les autres options sont agrammaticales ou incorrectes dans ce contexte."
  },
  {
    q: "Although legend has it that the Pilgrims first set foot in America on Plymouth Rock in 1620, ______ documentary evidence confirming this.",
    blank: "______",
    opts: ["no", "still is no", "there is no", "but no"],
    ans: 2,
    exp: "\"There is no\" introduit une structure existentielle négative correcte. \"No\" seul ou \"but no\" sont incorrects après la virgule car il faut un sujet + verbe."
  },
  {
    q: "Despite its fishlike form, the whale is ______ and will drown if submerged too long.",
    blank: "______",
    opts: ["an animal breathes air", "an animal that breathes air", "an animal breathes air", "that an animal breathes air"],
    ans: 1,
    exp: "\"An animal that breathes air\" utilise une proposition relative correcte (that + verbe) pour qualifier \"animal\"."
  },
  {
    q: "Clouds ______ in warm air rises, cools, and condenses.",
    blank: "______",
    opts: ["when form water vapor", "form when water vapor", "form vapor water when", "vapor form when water"],
    ans: 1,
    exp: "\"Clouds form when water vapor [rises...]\" : \"form\" est le verbe principal, \"when\" introduit la subordonnée de temps avec \"water vapor\" comme sujet."
  },
  {
    q: "Portland, ______, is located primarily on two hilly peninsulas overlooking Casco Bay and its many islands.",
    blank: "______",
    opts: ["which Maine's largest city", "Maine's largest city, where", "is Maine's largest city", "Maine's largest city"],
    ans: 3,
    exp: "\"Maine's largest city\" est une appositive (explication entre virgules). Pas besoin de \"which\" ni de verbe ici car c'est une incise nominale."
  },
  {
    q: "Mars, the so-called red planet, is actually colored red by iron oxide and other impurities ______ the whole surface.",
    blank: "______",
    opts: ["that cover", "in which are covered", "that they cover", "and covered"],
    ans: 0,
    exp: "\"That cover\" est une proposition relative correcte : \"impurities that cover the whole surface\". \"That they cover\" est redondant (double sujet)."
  },
  {
    q: "The 1903 film The Great Train Robbery was the first significant film in which the classic western story's formula of crime and retribution ______.",
    blank: "______",
    opts: ["was used", "to be used", "used", "had used"],
    ans: 0,
    exp: "\"Was used\" (passif passé) est correct car la formule est utilisée (passive), et le contexte est passé. \"Used\" actif changerait le sens : ce n'est pas la formule qui utilise quelque chose."
  },
  {
    q: "When played in certain ways, the bassoon can produce comical sounds, ______ it sometimes referred to as the clown of the orchestra.",
    blank: "______",
    opts: ["or", "that", "so", "whether"],
    ans: 2,
    exp: "\"So\" exprime la conséquence : les sons comiques ont pour conséquence qu'on le surnomme \"le clown de l'orchestre\". C'est un \"so\" de résultat."
  },
  {
    q: "In modern societies, ______ authorized body such as a legislature or a court makes the law.",
    blank: "______",
    opts: ["some", "some of", "some the", "for some"],
    ans: 0,
    exp: "\"Some authorized body\" = un certain organe. \"Some\" devant un nom singulier signifie \"un certain\". \"Some of\" nécessiterait un article après (some of the)."
  },
  {
    q: "The sense of smell functions chemically, ______ the sense of taste, but it is 10,000 times more sensitive.",
    blank: "______",
    opts: ["as does", "so have", "which as", "by which"],
    ans: 0,
    exp: "\"As does the sense of taste\" est une structure comparative inversée (comme le fait le sens du goût). C'est une ellipse élégante : \"as the sense of taste does\"."
  },
  {
    q: "______ primarily from plant oils, perfumes were used in ancient times as incense in religious rites, in medicines, and later for adornment.",
    blank: "______",
    opts: ["Made them", "They made", "Made", "By making"],
    ans: 2,
    exp: "\"Made\" est un participe passé utilisé en appositive participiale (= Being made / Having been made). Le sujet implicite est \"perfumes\". \"Made them\" ou \"They made\" créeraient un dangling modifier."
  },
  {
    q: "Boise became ______ of the state of Idaho in 1864.",
    blank: "______",
    opts: ["as the capital", "the capital", "to be the capital", "the capital was"],
    ans: 1,
    exp: "\"Became the capital\" : après \"become\", on utilise directement le groupe nominal sans \"as\", \"to be\", ou verbe supplémentaire."
  },
];
