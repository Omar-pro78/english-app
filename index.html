function launchConfetti(count = 80) {
  const canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#c1121f','#2d6a4f','#7c3aed','#ea6c00','#b45309','#52b788','#ff4d5e','#fbbf24'];
  const particles = Array.from({length: count}, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 40,
    r: 4 + Math.random() * 6,
    d: 2 + Math.random() * 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    tilt: Math.random() * 20 - 10,
    tiltAngle: 0,
    tiltSpeed: 0.05 + Math.random() * 0.08,
    opacity: 1,
  }));
  let frame;
  let tick = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tick++;
    particles.forEach(p => {
      p.tiltAngle += p.tiltSpeed;
      p.y += p.d;
      p.tilt = Math.sin(p.tiltAngle) * 12;
      if (tick > 120) p.opacity -= 0.015;
      ctx.beginPath();
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.ellipse(p.x + p.tilt, p.y, p.r * 0.5, p.r, p.tiltAngle, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (particles.some(p => p.opacity > 0)) {
      frame = requestAnimationFrame(draw);
    } else {
      canvas.style.display = 'none';
      cancelAnimationFrame(frame);
    }
  }
  draw();
}

// MINI-DIALOGUE SYSTEM — génération via API Claude
// ═══════════════════════════════════════════════════════════

// Cache en mémoire + localStorage pour persister entre sessions

const DIALOG_SITUATIONS = [
  'standup meeting', 'Slack thread', 'Jira ticket comment',
  'call with a developer', 'sprint review', 'bug triage',
  'test planning meeting', 'release call', 'PR review comment',
  'email to product owner'
];

async function generateDialog(item) {
  const key = dialogKey(item);
  if (DIALOGS_CACHE[key] || DIALOGS_GENERATING.has(key)) return;
  // Use hardcoded fallback instantly if API unavailable
  if (DIALOGS_FALLBACK[key]) {
    DIALOGS_CACHE[key] = DIALOGS_FALLBACK[key];
    saveDialogsCache();
    render();
    return;
  }
  DIALOGS_GENERATING.add(key);

  const situation = DIALOG_SITUATIONS[item._idx % DIALOG_SITUATIONS.length];
  const wordOrExpr = item.en;
  const translation = item.fr;

  const prompt = `You are generating a training dialog for a French QA engineer (named Omar) learning English at work (Lacoste e-commerce team).

Generate a SHORT realistic work dialog of exactly 2-3 exchanges (lines) set in a "${situation}" context.
The word/expression "${wordOrExpr}" (meaning: "${translation}") MUST appear in bold using **double asterisks** in one of the lines.

Rules:
- Speakers: use short labels like "Omar:", "Dev:", "PO:", "Lead:", "QA Lead:" etc.
- Each line: max 15 words, natural spoken English
- Realistic QA/tech context only
- Return ONLY a JSON array, no markdown, no explanation. Format:
[{"speaker":"Omar","line":"I think **${wordOrExpr}** here because the page breaks on Chrome."},{"speaker":"Dev","line":"Got it, I'll check the logs right away."}]`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = (data.content || []).map(b => b.text || '').join('').trim();
    // Strip any accidental ```json fences
    const clean = text.replace(/```json|```/g, '').trim();
    const dialog = JSON.parse(clean);
    if (Array.isArray(dialog) && dialog.length >= 2) {
      DIALOGS_CACHE[key] = dialog;
      saveDialogsCache();
      render(); // re-render to show the dialog
    }
  } catch(e) {
    // API failed — use hardcoded fallback if available
    if (DIALOGS_FALLBACK[key]) {
      DIALOGS_CACHE[key] = DIALOGS_FALLBACK[key];
      saveDialogsCache();
      render();
    }
  } finally {
    DIALOGS_GENERATING.delete(key);
  }
}

// Render a dialog block (HTML string)
function renderDialogBlock(item, panelClr) {
  const key = dialogKey(item);
  const dialog = DIALOGS_CACHE[key];
  const isGenerating = DIALOGS_GENERATING.has(key);

  if (!dialog && !isGenerating) return '';

  if (isGenerating && !dialog) {
    return `
      <div style="margin-top:12px;padding:12px 14px;background:rgba(124,58,237,.06);border:1.5px solid rgba(124,58,237,.2);border-radius:12px;">
        <div style="font-family:var(--mono);font-size:.52rem;color:#7c3aed;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;">💬 Dialogue en contexte réel</div>
        <div style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--muted);">
          <div class="speak-loading-dot"><span></span><span></span><span></span></div>
          Génération du dialogue...
        </div>
      </div>`;
  }

  const lines = dialog.map(line => {
    // Render **bold** markers
    const rendered = line.line.replace(/\*\*(.+?)\*\*/g, '<strong style="color:#7c3aed;background:rgba(124,58,237,.12);padding:1px 4px;border-radius:3px;">$1</strong>');
    // Plain text for TTS (strip markdown)
    const plain = line.line.replace(/\*\*/g, '');
    return `
      <div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06);">
        <span style="font-family:var(--mono);font-size:.56rem;color:var(--muted);min-width:46px;padding-top:2px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;">${line.speaker}</span>
        <span style="font-size:.8rem;color:var(--text);line-height:1.5;flex:1;">${rendered}</span>
        <button class="btn-audio" onclick="speak('${esc(plain)}','en')" style="flex-shrink:0;margin-top:1px;border-color:#7c3aed33;color:#7c3aed;">${spkSvg()}</button>
      </div>`;
  }).join('');

  return `
    <div style="margin-top:12px;padding:12px 14px;background:rgba(124,58,237,.05);border:1.5px solid rgba(124,58,237,.2);border-radius:12px;">
      <div style="font-family:var(--mono);font-size:.52rem;color:#7c3aed;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;">💬 Dialogue en contexte réel</div>
      ${lines}
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// DIALOGS CACHE
// ═══════════════════════════════════════════════════════════
let DIALOGS_CACHE = {};
const DIALOGS_LS_KEY = 'qa_english_dialogs_v1';
const DIALOGS_GENERATING = new Set();

function loadDialogsCache() {
  try {
    const raw = localStorage.getItem(DIALOGS_LS_KEY);
    if (raw) DIALOGS_CACHE = JSON.parse(raw);
  } catch(e) {}
  _loadDialogsFirestore();
}

async function _loadDialogsFirestore() {
  try {
    const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const db = getFirestore(window._fbApp);
    const snap = await getDoc(doc(db, 'users/omar_dialogs'));
    if (snap.exists() && snap.data().cache) {
      DIALOGS_CACHE = snap.data().cache;
      localStorage.setItem(DIALOGS_LS_KEY, JSON.stringify(DIALOGS_CACHE));
    }
  } catch(e) {}
}

function saveDialogsCache() {
  try { localStorage.setItem(DIALOGS_LS_KEY, JSON.stringify(DIALOGS_CACHE)); }
  catch(e) {}
  clearTimeout(saveDialogsCache._t);
  saveDialogsCache._t = setTimeout(async () => {
    try {
      const { getFirestore, doc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const db = getFirestore(window._fbApp);
      await setDoc(doc(db, 'users/omar_dialogs'), { cache: DIALOGS_CACHE });
    } catch(e) {}
  }, 2000);
}

function dialogKey(item) {
  return item._sec + ':' + item._idx;
}

// ═══════════════════════════════════════════════════════════
// VOICE PICKER
// ═══════════════════════════════════════════════════════════
function _populateVoiceSelect() {
  const sel = document.getElementById('voiceSelect');
  if (!sel) return;
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  if (!voices.length) return;
  sel.innerHTML = '';
  // Sort: network voices first, then alphabetical
  voices.sort((a,b) => {
    if (!a.localService && b.localService) return -1;
    if (a.localService && !b.localService) return 1;
    return a.name.localeCompare(b.name);
  });
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.dataset.name = v.name;
    opt.dataset.lang = v.lang;
    const tag = v.localService ? '📦' : '🌐';
    opt.textContent = `${tag} ${v.name} (${v.lang})`;
    // Pre-select current cached voice
    if (_cachedEnVoice && v.name === _cachedEnVoice.name) opt.selected = true;
    sel.appendChild(opt);
  });
}

function toggleVoicePicker() {
  const panel = document.getElementById('voicePanel');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) _populateVoiceSelect();
}

function applyVoiceChoice() {
  const sel = document.getElementById('voiceSelect');
  const opt = sel.options[sel.selectedIndex];
  if (!opt) return;
  const voices = speechSynthesis.getVoices();
  const chosen = voices.find(v => v.name === opt.dataset.name && v.lang === opt.dataset.lang);
  if (chosen) {
    _cachedEnVoice = chosen;
    // Persist choice
    try { localStorage.setItem('qa_voice_name', chosen.name); localStorage.setItem('qa_voice_lang', chosen.lang); } catch(e) {}
  }
}

function testVoice() {
  speechSynthesis.cancel();
  const rate  = parseFloat(document.getElementById('voiceRate').value);
  const pitch = parseFloat(document.getElementById('voicePitch').value);
  const u = new SpeechSynthesisUtterance("Hello! This is a test of the selected voice. How does it sound?");
  u.lang  = 'en-GB';
  u.rate  = rate;
  u.pitch = pitch;
  if (_cachedEnVoice) u.voice = _cachedEnVoice;
  speechSynthesis.speak(u);
  // Apply rate/pitch settings globally
  try {
    localStorage.setItem('qa_voice_rate',  rate);
    localStorage.setItem('qa_voice_pitch', pitch);
  } catch(e) {}
}

// Load persisted voice settings on startup
function _loadVoicePrefs() {
  try {
    const name  = localStorage.getItem('qa_voice_name');
    const lang  = localStorage.getItem('qa_voice_lang');
    const rate  = localStorage.getItem('qa_voice_rate');
    const pitch = localStorage.getItem('qa_voice_pitch');
    if (rate)  document.getElementById('voiceRate').value  = rate;
    if (pitch) document.getElementById('voicePitch').value = pitch;
    if (rate)  document.getElementById('voiceRateVal').textContent  = parseFloat(rate).toFixed(2);
    if (pitch) document.getElementById('voicePitchVal').textContent = parseFloat(pitch).toFixed(2);
    if (name && lang) {
      // Will be applied once voices load
      function tryRestore() {
        const voices = speechSynthesis.getVoices();
        const v = voices.find(x => x.name === name && x.lang === lang);
        if (v) { _cachedEnVoice = v; return true; }
        return false;
      }
      if (!tryRestore()) {
        speechSynthesis.addEventListener('voiceschanged', function once() {
          speechSynthesis.removeEventListener('voiceschanged', once);
          tryRestore();
        });
      }
    }
  } catch(e) {}
}

// speak() utilise les réglages du voice picker (rate/pitch sliders)
function _speakWithPrefs(txt, lang) {
  if (!window.speechSynthesis) { toast('Audio non supporté'); return; }
  speechSynthesis.cancel();
  const tgtLang = lang === 'fr' ? 'fr' : 'en';
  _ensureVoice(tgtLang, function(voice) {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang  = tgtLang === 'fr' ? 'fr-FR' : 'en-GB';
    try {
      u.rate  = tgtLang === 'en' ? parseFloat(localStorage.getItem('qa_voice_rate')  || '0.85') : 0.88;
      u.pitch = tgtLang === 'en' ? parseFloat(localStorage.getItem('qa_voice_pitch') || '1.05') : 1.05;
    } catch(e) { u.rate = 0.85; u.pitch = 1.05; }
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  });
}
// Remplace la fonction globale speak() par la version avec préférences
window.speak = _speakWithPrefs;

_loadVoicePrefs();
if (speechSynthesis.getVoices().length) _populateVoiceSelect();
speechSynthesis.addEventListener('voiceschanged', _populateVoiceSelect);

  load();
