        + '<div style="font-size:.78rem;color:var(--text);font-weight:600;margin-bottom:2px;">' + letters[q.ans] + '. ' + q.opts[q.ans] + '</div>'
        + wrongLine
        + '</div></div>';
    }

    wrap.innerHTML = '<div class="lt-header">'
      + '<div class="lt-tag">🎧 Listening Test</div>'
      + '<div class="lt-tag" style="background:rgba(45,106,79,.08);border-color:rgba(45,106,79,.3);color:#2d6a4f">Resultats</div>'
      + '</div>'

      + '<div class="lt-score-big">' + correct + ' / ' + total + '</div>'

      + '<button class="lt-btn-nav primary" onclick="ltReset()" style="margin:0 auto;display:block;">🔄 Recommencer</button>'
      + '</div>'

    + (isSpeaking ? 'opacity:.35;cursor:default;' : '')

    const clickHandler = done ? '' : 'ltSelectOption(' + qi + ',' + oi + ')';
    optsHtml += '<div class="' + cls + '" onclick="' + clickHandler + '">' + labelHtml + '</div>';
  }

  // Feedback
  let feedbackHtml = '';
  if (done) {
    const fbCls = isCorrect ? 'ok' : 'fail';

      ? '✓ Bonne réponse !'

  const listenHint = done ? '' : '<div class="lt-listen-hint"><span class="lt-hint-icon">👂</span><span>Écoute, puis sélectionne la bonne lettre</span></div>';

  wrap.innerHTML = '<div class="lt-header">'
    + '<div class="lt-tag">🎧 Listening Test</div>'
    + '<div class="lt-prog-wrap">'
    + '<div class="lt-prog-bar"><div class="lt-prog-fill" style="width:' + pct + '%"></div></div>'

    + '</div></div>'

    + '<div class="lt-img-wrap">'
    + '<img class="lt-img" src="' + q.img + '" alt="Question ' + q.num + '">'
    + '<div class="lt-q-num">QUESTION ' + q.num + '</div>'
    + '</div>'
    + '<div class="lt-body">'
    + '<div class="lt-audio-center">' + audioBtns + '</div>'

    + '<button class="lt-btn-nav" onclick="ltPrev()"' + prevDisabled + '>← Précédent</button>'
    + '<span style="font-family:var(--mono);font-size:.65rem;color:var(--muted)">' + (qi+1) + ' / ' + total + '</span>'
    + navRight
    + '</div>'
    + resetLink;

  // Auto-play only on first visit to each new question (not yet answered, not currently speaking)
  if (!done && !_ltSpeaking && !_ltAutoPlayed.has(qi)) {
    _ltAutoPlayed.add(qi);
    clearTimeout(_ltAutoTimer);
    _ltAutoTimer = setTimeout(function() { ltSpeak(qi); }, 450);
  }

  return wrap;
}

let _dtSpeaking = false;
let _dtUtterance = null;

function dtStopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  _dtSpeaking = false;
  _dtUtterance = null;
  // Reset all play buttons
  document.querySelectorAll('.dt-play-btn').forEach(b => {
    b.classList.remove('playing');
    b.innerHTML = '🔊 Écouter';
  });
}

function dtSpeak(text, btnEl, onEnd) {
  if (!window.speechSynthesis) return;
  dtStopSpeaking();
  _ensureVoice('en', function(voice) {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = 'en-GB';
    utt.rate  = 0.88;
    utt.pitch = 1.05;
    if (voice) utt.voice = voice;
    _dtUtterance = utt;
    _dtSpeaking = true;
    if (btnEl) { btnEl.classList.add('playing'); btnEl.innerHTML = '⏹ Arrêter'; }
    utt.onend = utt.onerror = function() {
      _dtSpeaking = false;
      if (btnEl && document.body.contains(btnEl)) {
        btnEl.classList.remove('playing');
        btnEl.innerHTML = '🔊 Écouter';
      }
      if (onEnd) onEnd();
    };
    window.speechSynthesis.speak(utt);
  });
}

    feedbackHtml = '<div class="lt-feedback ' + fbCls + '">' + fbMsg + '</div>' + explHtml;
  } else if (_ltPending !== null) {
    feedbackHtml = '<button class="lt-validate-btn" onclick="lt2Validate(' + qi + ')">✓ Valider ma réponse</button>';

  let navRight = '';
  if (qi < total - 1) {
    navRight = '<button class="lt-btn-nav primary" onclick="lt2Next()">Suivant →</button>';
  } else if (answered === total) {
    navRight = '<button class="lt-btn-nav primary" onclick="lt2Next()">🏆 Voir les résultats</button>';
  } else {
    navRight = '<button class="lt-btn-nav primary" onclick="lt2Next()" style="opacity:.5">Suivant →</button>';

  wrap.innerHTML = '<div class="lt-header">'
    + '<div class="lt-tag">🎧 Listening Test 2</div>'
    + '<div class="lt-tag" style="background:rgba(29,111,164,.08);border-color:rgba(29,111,164,.3);color:#1d6fa4">Part 1 — Photographs</div>'
    + '</div>'
    + '<div class="lt-progress-bar"><div class="lt-progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="lt-progress-txt">Question ' + (qi+1) + ' / ' + total + ' · ' + answered + ' répondues</div>'
    + '<div class="' + cardCls + '">'
    + '<img class="lt-photo" src="' + q.img + '" alt="Photo question ' + (qi+1) + '">'
    + '<div class="lt-consigne">🎧 Écoutez les 4 propositions — choisissez celle qui décrit l\'image</div>'
    + audioBtns
    + '<div class="lt-opts-grid">' + optsHtml + '</div>'
    + feedbackHtml
    + '</div>'
    + '<div class="lt-nav">'
    + '<button class="lt-btn-nav" onclick="lt2Prev()" ' + (qi === 0 ? 'disabled' : '') + '>← Précédent</button>'
    + navRight
    + '</div>';

  // Auto-play on first visit
  if (!_ltAutoPlayed) _ltAutoPlayed = new Set();
  const autoKey = 'lt2_' + qi;
  if (!_ltAutoPlayed.has(autoKey) && !done) {
    _ltAutoPlayed.add(autoKey);
    _ltAutoTimer = setTimeout(function() { lt2Speak(qi); }, 600);
  }

  return wrap;
}

    `;

  }

  const qi = dt.cursor;
  const q  = DIRECTIONS_TEST[qi];
  const answered = dt.answers[qi] !== undefined;
  const userAns  = dt.answers[qi];
  const pct = total > 0 ? Math.round((Object.keys(dt.answers).length / total) * 100) : 0;

  // ── Header ────────────────────────────────────────────
  const header = document.createElement('div');
  header.className = 'dt-header';
  header.innerHTML = `
    <div class="dt-tag">🧭 Directions — Part 2</div>
    <div class="dt-prog-wrap">
      <div class="dt-prog-bar"><div class="dt-prog-fill" style="width:${pct}%"></div></div>
      <div class="dt-prog-label">${qi+1}/${total}</div>
    </div>
  `;
  wrap.appendChild(header);

  // ── Card ──────────────────────────────────────────────
  const card = document.createElement('div');
  card.className = 'dt-card' + (answered ? (userAns === q.ans ? ' answered-ok' : ' answered-fail') : '');

  // Build full TTS text: question + options A, B, C in sequence
  const fullText = `Question ${qi+1}. ${q.question}. Option A: ${q.options.A}. Option B: ${q.options.B}. Option C: ${q.options.C}.`;

  // Pending selection tracking
  let _pending = null;

  card.innerHTML = `
    <div class="dt-body">
      <div class="dt-qnum">Question ${qi+1} / ${total}</div>

      <div class="dt-audio-row">
        <button class="dt-play-btn" id="dtPlayBtn">🔊 Écouter</button>
      </div>

      <div class="dt-opts" id="dtOpts">
        ${['A','B','C'].map(letter => {
          let cls = 'dt-opt';
          let revealedCls = '';
          if (answered) {
            cls += ' disabled';
            if (letter === userAns) {
              cls += letter === q.ans ? ' correct revealed' : ' wrong revealed';
            } else if (letter === q.ans) {
              cls += ' reveal-correct revealed';
            }
          }
          return `
            <div class="${cls}" data-letter="${letter}" id="dtOpt${letter}">
              <div class="dt-opt-letter">${letter}</div>
              <button class="dt-opt-audio" onclick="event.stopPropagation();
                dtSpeak('${q.options[letter].replace(/'/g,"\\'")}', this)">🔊</button>
              <div class="dt-opt-text">${q.options[letter]}</div>
            </div>`;
        }).join('')}
      </div>

      ${answered ? `
        <div class="dt-feedback ${userAns === q.ans ? 'ok' : 'fail'}">
          <div style="font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-bottom:6px;font-style:italic;">❝ ${q.question} ❞</div>
          ${userAns === q.ans
            ? `✅ Correct ! La bonne réponse est <strong>${q.ans}</strong> : <em>${q.options[q.ans]}</em>`
            : `❌ Incorrect. Tu as choisi <strong>${userAns}</strong> — la bonne réponse est <strong>${q.ans}</strong> : <em>${q.options[q.ans]}</em>`}
        </div>` : ''}

      ${!answered ? `<button class="dt-validate-btn" id="dtValidateBtn" disabled>Valider ma réponse</button>` : ''}
    </div>
  `;

  // ── Wire: play button (full sequence)
  card.querySelector('#dtPlayBtn').addEventListener('click', function() {
    if (_dtSpeaking) { dtStopSpeaking(); return; }
    dtSpeak(fullText, this);
  });

  // ── Wire: option selection (only before answering)
  if (!answered) {
    ['A','B','C'].forEach(letter => {
      const optEl = card.querySelector(`#dtOpt${letter}`);
      optEl.addEventListener('click', function() {
        // Deselect all
        ['A','B','C'].forEach(l => {
          const el = card.querySelector(`#dtOpt${l}`);
          el.classList.remove('pending');
        });
        // Select this
        optEl.classList.add('pending');
        _pending = letter;
        card.querySelector('#dtValidateBtn').disabled = false;
      });
    });

    // ── Wire: validate button
    card.querySelector('#dtValidateBtn').addEventListener('click', function() {
      if (!_pending) return;
      dt.answers[qi] = _pending;
      save();
      render();
    });
  }

  wrap.appendChild(card);

  // ── Nav buttons ───────────────────────────────────────
  const nav = document.createElement('div');
  nav.className = 'dt-nav';

  const btnPrev = document.createElement('button');
  btnPrev.className = 'dt-btn-nav';
  btnPrev.textContent = '← Précédent';
  btnPrev.disabled = qi === 0;
  btnPrev.addEventListener('click', function() {
    dtStopSpeaking();
    dt.cursor--;
    save();
    render();
  });

  const btnNext = document.createElement('button');
  if (qi === total - 1 && answered) {
    btnNext.className = 'dt-btn-nav primary';
    btnNext.textContent = 'Voir les résultats →';
    btnNext.addEventListener('click', function() {
      dtStopSpeaking();
      dt.showResults = true;
      save();
      render();
    });
  } else {
    btnNext.className = 'dt-btn-nav primary';
    btnNext.textContent = 'Suivant →';
    btnNext.disabled = !answered;
    btnNext.addEventListener('click', function() {
      dtStopSpeaking();
      dt.cursor++;
      save();
      render();
    });
  }

  nav.appendChild(btnPrev);
  nav.appendChild(btnNext);
  wrap.appendChild(nav);

  return wrap;
}

let _dt2Speaking = false;

function dt2StopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  _dt2Utterance = null;
  document.querySelectorAll('.dt2-play-btn').forEach(b => {
    b.classList.remove('playing');
    b.innerHTML = '🔊 Écouter';
  });
}

function dt2Speak(text, btnEl, onEnd) {
  if (!window.speechSynthesis) return;
  dt2StopSpeaking();
  _ensureVoice('en', function(voice) {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = 'en-GB';
    utt.rate  = 0.88;
    utt.pitch = 1.05;
    if (voice) utt.voice = voice;

    _dt2Speaking = true;
    if (btnEl) { btnEl.classList.add('playing'); btnEl.innerHTML = '⏹ Arrêter'; }
    utt.onend = utt.onerror = function() {
      _dt2Speaking = false;
      if (btnEl && document.body.contains(btnEl)) {
        btnEl.classList.remove('playing');
        btnEl.innerHTML = '🔊 Écouter';
      }
      if (onEnd) onEnd();
    };
    window.speechSynthesis.speak(utt);
  });
}

function dt4StopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  _dt4Utterance = null;
  document.querySelectorAll('.dt4-play-btn').forEach(b => {
    b.classList.remove('playing');
    b.innerHTML = '🔊 Écouter';
  });
}

function dt4Speak(text, btnEl, onEnd) {
  if (!window.speechSynthesis) return;
  dt4StopSpeaking();
  _ensureVoice('en', function(voice) {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = 'en-GB';
    utt.rate  = 0.88;
    utt.pitch = 1.05;
    if (voice) utt.voice = voice;
    _dt4Utterance = utt;
    _dt4Speaking = true;
    if (btnEl) { btnEl.classList.add('playing'); btnEl.innerHTML = '⏹ Arrêter'; }
    utt.onend = utt.onerror = function() {
      _dt4Speaking = false;
      if (btnEl && document.body.contains(btnEl)) {
        btnEl.classList.remove('playing');
        btnEl.innerHTML = '🔊 Écouter';
      }
      if (onEnd) onEnd();
    };
    window.speechSynthesis.speak(utt);
  });
}

function srKey(sec, idx) { return sec+'_'+idx; }

function srGetCard(sec, idx) {
  const key = srKey(sec, idx);
  return S.sr[key] || { interval: 0, easeFactor: 2.5, due: 0, reps: 0 };
}

function srRate(sec, idx, grade) {
  const key = srKey(sec, idx);
  const card = srGetCard(sec, idx);
  const today = Math.floor(Date.now() / 86400000);
  let { interval, easeFactor, reps } = card;
  const q = grade === 0 ? 2 : grade === 1 ? 4 : 5;
  if (q < 3) { reps = 0; interval = 1; }
  else {
    if (reps === 0)      interval = 1;
    else if (reps === 1) interval = 6;
    else                 interval = Math.round(interval * easeFactor);
    reps++;
  }
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  const due = today + interval;
  S.sr[key] = { interval, easeFactor, due, reps };
  if (!S.status) S.status = {};
  S.status[key] = reps > 0 ? 'ok' : 'review';
  save();
  return { interval, due };
}

function srIsDue(sec, idx) {
  const card = srGetCard(sec, idx);
  if (card.reps === 0 && card.due === 0) return true;
  const today = Math.floor(Date.now() / 86400000);
  return card.due <= today;
}

function srDueCount() {
  const fcSecs = ['vocab','expr','prep','phrasal','take'];
  let count = 0;
  fcSecs.forEach(sec => {
    (DATA[sec] || []).forEach((_, i) => {
      const card = srGetCard(sec, i);
      if (card.reps > 0 && srIsDue(sec, i)) count++;
    });
  });
  return count;
}

function srDueLabel(interval) {
  if (interval <= 1)  return '1j';
  if (interval <= 6)  return interval+'j';
  if (interval <= 30) return Math.round(interval/7)+'sem';
  return Math.round(interval/30)+'mois';
}

function srDueQueue() {
  const fcSecs = ['vocab','expr','prep','phrasal','take'];
  const due = [], newItems = [];
  const today = Math.floor(Date.now() / 86400000);
  fcSecs.forEach(sec => {
    (DATA[sec] || []).forEach((item, i) => {
      const card = srGetCard(sec, i);
      const entry = { ...item, _sec: sec, _idx: i };
      if (card.reps === 0) newItems.push(entry);
      else if (card.due <= today) due.push(entry);
    });
  });
  return [...shuffle(due), ...shuffle(newItems)];
}

function computeNextStep() {
  const MODULES = ['vocab','expr','prep','phrasal','take','grammar','grammar2','grammar3','grammar4','grammar5','grammar6'];

  // ── Contexte temporel ──────────────────────────────────────
  const now = Date.now();
  const lastTs   = S.lastSession ? S.lastSession.ts : null;
  const lastKey  = S.lastSession ? S.lastSession.moduleKey : null;
  const hoursAgo = lastTs ? (now - lastTs) / 3600000 : Infinity;
  const isAbsent = hoursAgo > 48;   // absent depuis +2 jours
  const isRecent = hoursAgo < 2;    // session il y a moins de 2h

  // ── PRIORITÉ 1 : session pausée en plein milieu d'un lot ──
  // Le dernier module touché prime sur tout le reste
  if (lastKey) {
    const cfg  = SESS_CFG[lastKey];
    const prog = S.sessProgress[lastKey];
    if (cfg && prog) {
      const data = cfg.getData();
      const pos  = prog.pos;
      // Il reste des items ET c'est en plein milieu d'un batch (pas au début d'un nouveau lot)
      const midBatch = pos % BATCH_SIZE !== 0 && pos < data.length;
      if (midBatch) {
        const batchNum = Math.floor(pos / BATCH_SIZE) + 1;
        return {
          tab: lastKey,
          icon: '▶',
          eyebrow: 'Reprends là où tu t\'es arrêté',
          label: `${cfg.label} — Lot ${batchNum}`,
          sub: `Position ${pos % BATCH_SIZE}/${BATCH_SIZE} · en cours`,
          action: ((k, p) => () => startSession(k, p, false, 'home'))(lastKey, pos),
        };
      }
    }
  }

  // ── PRIORITÉ 2 : cartes SR dues aujourd'hui ───────────────
  const srDue = srDueCount();
  if (srDue > 0) {
    return {
      tab: 'review',
      icon: '🧠',
      eyebrow: 'Révision espacée',
      label: `${srDue} carte${srDue>1?'s':''} à revoir aujourd'hui`,
      sub: `SM-2 — renforce ta mémoire long terme`,
      action: () => { S.tab = 'review'; render(); },
    };
  }

  // ── PRIORITÉ 3 : cartes en erreur (review) ────────────────
  const rv = cntRev();
  if (rv > 0) {
    // Trouver quel module concentre le plus d'erreurs
    let worstModule = null, worstCount = 0;
    ['vocab','expr','prep','phrasal','take'].forEach(mk => {
      const c = DATA[mk] ? DATA[mk].filter((_,i) => getS(mk,i) === 'review').length : 0;
      if (c > worstCount) { worstCount = c; worstModule = mk; }
    });
    const sub = worstModule
      ? `${rv} erreur${rv>1?'s':''} · surtout en ${SESS_CFG[worstModule]?.label || worstModule}`
      : `${rv} carte${rv>1?'s':''} à revoir`;
    return {
      tab: 'review',
      icon: '🎯',
      eyebrow: 'Consolide tes points faibles',
      label: 'Révision des erreurs',
      sub,
    };
  }

  // ── PRIORITÉ 3 : lot suivant du dernier module touché ─────
  if (lastKey) {
    const cfg  = SESS_CFG[lastKey];
    const prog = S.sessProgress[lastKey];
    if (cfg && prog) {
      const data = cfg.getData();
      const pos  = prog.pos;
      if (pos > 0 && pos < data.length) {
        const batchNum = Math.floor(pos / BATCH_SIZE) + 1;
        const batchTotal = Math.ceil(data.length / BATCH_SIZE);
        const pct = Math.round((pos / data.length) * 100);
        const tone = isAbsent
          ? `Ça fait ${Math.round(hoursAgo/24)}j — reprends en douceur 👋`
          : `Lot ${batchNum}/${batchTotal} · ${pct}% complété`;
        return {
          tab: lastKey,
          icon: isAbsent ? '👋' : '▶',
          eyebrow: isAbsent ? 'Bon retour !' : 'Continue ta progression',
          label: `${cfg.label}`,
          sub: tone,
          action: ((k, p) => () => startSession(k, p, false, 'home'))(lastKey, pos),
        };
      }
    }
  }

  // ── PRIORITÉ 4 : module le moins avancé (non terminé) ─────
  let leastModule = null, leastPct = Infinity;
  for (const mk of MODULES) {
    const cfg = SESS_CFG[mk];
    if (!cfg) continue;
    const data = cfg.getData();
    const done = cfg.type === 'fc'
      ? data.filter((_,i) => getS(mk,i) === 'ok').length
      : Object.keys(S[cfg.answersKey] || {}).length;
    const pct = data.length > 0 ? done / data.length : 1;
    if (pct < 1 && pct < leastPct) { leastPct = pct; leastModule = mk; }
  }
  if (leastModule) {
    const cfg  = SESS_CFG[leastModule];
    const prog = S.sessProgress[leastModule] || null;
    const pos  = prog ? prog.pos : 0;
    const pct  = Math.round(leastPct * 100);
    return {
      tab: leastModule,
      icon: pct === 0 ? '🆕' : '📈',
      eyebrow: pct === 0 ? 'Nouveau module' : 'Module le moins avancé',
      label: cfg.label,
      sub: pct === 0 ? `${cfg.getData().length} items · pas encore commencé` : `${pct}% complété`,
      action: ((m, p) => () => startSession(m, p, false, 'home'))(leastModule, pos),
    };
  }

  // ── FALLBACK : tout terminé ────────────────────────────────
  return {
    tab: 'review',
    icon: '🏆',
    eyebrow: 'Tout complété !',
    label: 'Refaire un quiz complet',
    sub: 'Maintiens ton niveau',
  };
}

function computeDailyMission() {
  // Retourne 1 mission principale claire + contexte
  const rv      = cntRev();
  const srDue   = srDueCount();
  const lots    = S.daily.lotsCompleted;
  const actions = S.daily.actions;
  const goal    = S.daily.goal;

  // Cas 0 : cartes SR dues (priorité absolue)
  if (srDue > 0) {
    return {
      icon: '🧠',
      title: `${srDue} carte${srDue>1?'s':''} SR à revoir`,
      detail: 'La répétition espacée renforce la mémoire long terme',
      progress: null,
      cta: () => { S.tab = 'review'; render(); },
      ctaLabel: 'Lancer la révision SR',
    };
  }

  // Cas 1 : erreurs urgentes (priorité absolue si > 3)
  if (rv >= 3) {
    return {
      icon: '🎯',
      title: `Révise tes ${rv} erreurs`,
      detail: 'Des cartes t\'attendent — consolide avant d\'avancer',
      progress: null,
      cta: () => { S.tab = 'review'; render(); },
      ctaLabel: 'Réviser maintenant',
    };
  }

  // Cas 2 : aucun lot fait aujourd'hui → objectif = faire 1 lot
  if (lots === 0) {
    const next = computeNextStep();
    return {
      icon: '▶',
      title: 'Fais ton premier lot du jour',
      detail: '10 minutes suffisent pour progresser',
      progress: null,
      cta: next.action || (() => { if (next.tab) switchTab(next.tab); }),
      ctaLabel: 'Commencer',
    };
  }

  // Cas 3 : en cours vers l'objectif quotidien
  if (actions < goal) {
    return {
      icon: '📈',
      title: `${actions} / ${goal} actions aujourd'hui`,
      detail: `${goal - actions} de plus et ta mission est accomplie`,
      progress: { done: actions, total: goal },
      cta: null,
      ctaLabel: null,
    };
  }

  // Cas 4 : objectif atteint
  return {
    icon: '✅',
    title: 'Mission du jour accomplie !',
    detail: `${lots} lot${lots>1?'s':''} complété${lots>1?'s':''} · ${actions} actions`,
    progress: { done: goal, total: goal },
    cta: null,
    ctaLabel: null,
  };
}

function buildDailyMissions() {
  const rv      = cntRev();
  const srDue   = srDueCount();
  const lots    = S.daily.lotsCompleted;
  const actions = S.daily.actions;
  const goal    = S.daily.goal;
  const mission = computeDailyMission();

  // Indicateurs secondaires (faits / à faire)
  const indicators = [
    {
      label: `${lots} lot${lots!==1?'s':''} aujourd'hui`,
      done: lots >= 1,

      done: actions >= goal,

let _lt3Audio = null;
let _lt3Playing = false;

function lt3StopAudio() {
  if (_lt3Audio) { _lt3Audio.pause(); _lt3Audio.currentTime = 0; _lt3Audio = null; }
  _lt3Playing = false;
}

function lt3PlayAudio(url, btnId) {
  lt3StopAudio();
  const btn = document.getElementById(btnId);
  _lt3Audio = new Audio(url);
  _lt3Playing = true;
  if (btn) { btn.classList.add('playing'); btn.textContent = '⏹ Stop'; }
  _lt3Audio.play().catch(()=>{});
  _lt3Audio.onended = () => {
    _lt3Playing = false;
    if (btn) { btn.classList.remove('playing'); btn.textContent = '▶ Écouter'; }
  };
}

window.lt3ToggleAudio = function(url, btnId) {
  if (_lt3Playing) { lt3StopAudio(); const b=document.getElementById(btnId); if(b){b.classList.remove('playing');b.textContent='▶ Écouter';} }
  else { lt3PlayAudio(url, btnId); }
};

window.lt3SelectAnswer = function(convIdx, qIdx, optIdx) {
  if (!S.listeningTest3) S.listeningTest3 = { convIdx:0, qIdx:0, answers:{}, showResults:false };
  const key = convIdx + '_' + qIdx;
  if (S.listeningTest3.answers[key] !== undefined) return; // already answered
  S.listeningTest3.answers[key] = optIdx;
  save();
  render();
};

window.lt3NextQ = function() {
  if (!S.listeningTest3) return;
  const conv = LISTENING_TEST3[S.listeningTest3.convIdx];
  if (!conv) return;
  if (S.listeningTest3.qIdx < conv.questions.length - 1) {
    S.listeningTest3.qIdx++;
  } else if (S.listeningTest3.convIdx < LISTENING_TEST3.length - 1) {
    lt3StopAudio();
    S.listeningTest3.convIdx++;
    S.listeningTest3.qIdx = 0;
  } else {
    lt3StopAudio();
    S.listeningTest3.showResults = true;
  }
  save(); render();
};

window.lt3PrevQ = function() {
  if (!S.listeningTest3) return;
  if (S.listeningTest3.qIdx > 0) {
    S.listeningTest3.qIdx--;
  } else if (S.listeningTest3.convIdx > 0) {
    S.listeningTest3.convIdx--;
    S.listeningTest3.qIdx = LISTENING_TEST3[S.listeningTest3.convIdx].questions.length - 1;
  }
  save(); render();
};

window.lt3Reset = function() {
  lt3StopAudio();
  S.listeningTest3 = { convIdx:0, qIdx:0, answers:{}, showResults:false };
  save(); render();
};

function buildListeningTest3() {
  if (!S.listeningTest3) S.listeningTest3 = { convIdx:0, qIdx:0, answers:{}, showResults:false };
  const lt3 = S.listeningTest3;
  const COLOR = '#1d6fa4';
  const wrap = document.createElement('div');
  wrap.className = 'lt-wrap fade-up';

  if (!LISTENING_TEST3 || !LISTENING_TEST3.length) {
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">Chargement…</div>';
    return wrap;
  }

  // Total questions count
  const allQs = LISTENING_TEST3.reduce((a,c)=>a+(c.questions?c.questions.length:0),0);
  const answered = Object.keys(lt3.answers).length;
  const pct = allQs > 0 ? Math.round((answered/allQs)*100) : 0;

  // Results screen
  if (lt3.showResults) {
    let correct = 0, total = 0;
    let reviewHtml = '';
    LISTENING_TEST3.forEach((conv, ci) => {
      reviewHtml += `<div style="margin-bottom:18px;">
        <div style="font-family:var(--mono);font-size:.55rem;color:${COLOR};text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;">
          Conversation ${ci+1} — ${conv.context}
        </div>`;
      conv.questions.forEach((q, qi) => {
        total++;
        const key = ci+'_'+qi;
        const ua = lt3.answers[key];
        const ok = ua === q.ans;
        if (ok) correct++;
        const borderColor = ua === undefined ? 'var(--border2)' : ok ? 'rgba(45,106,79,.45)' : 'rgba(193,18,31,.45)';
        const labelColor  = ua === undefined ? 'var(--muted)' : ok ? '#2d6a4f' : '#c1121f';
        const labelText   = ua === undefined ? 'NON RÉPONDU' : ok ? 'CORRECT' : 'INCORRECT';
        const letters = ['A','B','C','D'];
        const wrongLine = (!ok && ua !== undefined)
          ? `<div style="font-size:.72rem;color:#c1121f;margin-top:2px;">Tu as répondu : ${letters[ua]}. ${q.opts[ua]}</div>` : '';
        const explLine = q.explanation
          ? `<div style="font-size:.68rem;color:var(--muted);margin-top:4px;font-style:italic;">${q.explanation}</div>` : '';
        reviewHtml += `<div style="background:var(--surface);border:1.5px solid ${borderColor};border-radius:12px;padding:12px 14px;margin-bottom:6px;">
          <div style="font-family:var(--mono);font-size:.5rem;color:${labelColor};text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Q${qi+1} · ${labelText}</div>
          <div style="font-size:.78rem;color:var(--text);font-weight:600;margin-bottom:2px;">${q.q}</div>
          <div style="font-size:.75rem;color:#2d6a4f;margin-top:2px;">✓ ${letters[q.ans]}. ${q.opts[q.ans]}</div>
          ${wrongLine}${explLine}
        </div>`;
      });
      reviewHtml += '</div>';
    });

    const scoreColor = correct/total >= .8 ? '#2d6a4f' : correct/total >= .5 ? '#ea6c00' : '#c1121f';
    wrap.innerHTML = `
      <div class="lt-header">
        <div class="lt-tag">💬 Part 3 — Conversations</div>
        <div class="lt-prog-wrap">
          <div class="lt-prog-bar"><div class="lt-prog-fill" style="width:100%"></div></div>
          <div class="lt-prog-label">${total}/${total}</div>
        </div>
      </div>
      <div style="padding:24px 16px;text-align:center;">
        <div style="font-size:2.2rem;font-weight:800;color:${scoreColor};font-family:var(--mono);">${correct}/${total}</div>
        <div style="font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:2px;margin-top:4px;">SCORE FINAL</div>
        <div style="font-size:.85rem;color:var(--muted);margin-top:8px;">${Math.round(correct/total*100)}% de bonnes réponses</div>
      </div>
      <div style="padding:0 16px 16px;">${reviewHtml}</div>
      <div style="padding:0 16px 32px;">
        <button onclick="lt3Reset()" style="width:100%;padding:12px;border-radius:12px;border:none;background:${COLOR};color:#fff;font-family:var(--sans);font-weight:700;cursor:pointer;font-size:.85rem;">
          🔄 Recommencer
        </button>
      </div>`;
    return wrap;
  }

  // Question screen
  const conv = LISTENING_TEST3[lt3.convIdx];
  const q = conv.questions[lt3.qIdx];
  const key = lt3.convIdx + '_' + lt3.qIdx;
  const answered_q = lt3.answers[key];
  const letters = ['A','B','C','D'];

  // Global question number
  let globalQ = 0;
  for (let i = 0; i < lt3.convIdx; i++) globalQ += LISTENING_TEST3[i].questions.length;
  globalQ += lt3.qIdx + 1;

  // Audio button
  const audioId = 'lt3-audio-btn';
  const audioHtml = conv.audio
    ? `<button class="lt-play-btn" id="${audioId}" onclick="lt3ToggleAudio('${conv.audio}','${audioId}')">▶ Écouter la conversation</button>`
    : `<div style="font-size:.75rem;color:var(--muted);font-style:italic;">Audio non disponible</div>`;

  // Speakers display
  const speakersHtml = conv.speakers
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">${conv.speakers.map(s=>`<span style="font-family:var(--mono);font-size:.52rem;padding:2px 8px;border-radius:20px;background:rgba(29,111,164,.1);color:${COLOR};border:1px solid rgba(29,111,164,.25);">${s}</span>`).join('')}</div>` : '';

  // Graphic (table) if present
  let graphicHtml = '';
  if (conv.graphic && conv.graphic.type === 'table') {
    const g = conv.graphic;
    graphicHtml = `<div style="overflow-x:auto;margin-bottom:12px;">
      <table style="width:100%;border-collapse:collapse;font-size:.72rem;font-family:var(--mono);">
        <thead><tr>${g.headers.map(h=>`<th style="padding:6px 10px;background:rgba(29,111,164,.12);border:1px solid var(--border2);color:${COLOR};font-weight:700;">${h}</th>`).join('')}</tr></thead>
        <tbody>${g.rows.map(r=>`<tr>${r.map(c=>`<td style="padding:6px 10px;border:1px solid var(--border2);text-align:center;">${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  // Options
  let optsHtml = '';
  q.opts.forEach((opt, i) => {
    let cls = 'lt-opt';
    let icon = '';
    if (answered_q !== undefined) {
      if (i === q.ans) { cls += ' correct'; icon = ' ✓'; }
      else if (i === answered_q) { cls += ' wrong'; icon = ' ✗'; }
    } else if (answered_q === undefined) {
      cls += ' selectable';
    }
    optsHtml += `<div class="${cls}" onclick="lt3SelectAnswer(${lt3.convIdx},${lt3.qIdx},${i})">`
      + `<span class="lt-opt-letter">${letters[i]}</span>`
      + `<span class="lt-opt-text">${opt}${icon}</span>`
      + `</div>`;
  });

  // Feedback
  let feedbackHtml = '';
  if (answered_q !== undefined && q.explanation) {
    const ok = answered_q === q.ans;
    const bgColor = ok ? 'rgba(45,106,79,.08)' : 'rgba(193,18,31,.06)';
    const borderColor = ok ? 'rgba(45,106,79,.3)' : 'rgba(193,18,31,.3)';
    const icon = ok ? '✅' : '❌';
    feedbackHtml = `<div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:${bgColor};border:1px solid ${borderColor};">
      <div style="font-size:.78rem;font-weight:700;color:var(--text);margin-bottom:4px;">${icon} ${ok ? 'Bonne réponse !' : 'Incorrect'}</div>
      <div style="font-size:.73rem;color:var(--muted);line-height:1.5;">${q.explanation}</div>
    </div>`;
  }

  const isFirst = lt3.convIdx === 0 && lt3.qIdx === 0;
  const isLast  = lt3.convIdx === LISTENING_TEST3.length-1 && lt3.qIdx === conv.questions.length-1;
  const prevDisabled = isFirst ? 'disabled' : '';
  const nextLabel = answered_q !== undefined ? (isLast ? 'Voir les résultats' : 'Question suivante →') : '';
  const nextHtml = answered_q !== undefined
    ? `<button class="lt-btn-nav" onclick="lt3NextQ()" style="background:${COLOR};color:#fff;border-color:${COLOR};">${nextLabel}</button>`
    : `<span></span>`;

  wrap.innerHTML = `
    <div class="lt-header">
      <div class="lt-tag">💬 Part 3 — Conversations</div>
      <div class="lt-prog-wrap">
        <div class="lt-prog-bar"><div class="lt-prog-fill" style="width:${pct}%"></div></div>
        <div class="lt-prog-label">${answered}/${allQs}</div>
      </div>
    </div>
    <div class="lt-card${answered_q!==undefined ? (answered_q===q.ans?' answered-ok':' answered-fail') : ''}">
      <div class="lt-body" style="padding:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div style="font-family:var(--mono);font-size:.52rem;color:${COLOR};text-transform:uppercase;letter-spacing:1.5px;">
            Conversation ${lt3.convIdx+1}/${LISTENING_TEST3.length} · Question ${lt3.qIdx+1}/${conv.questions.length}
          </div>
          <div style="font-family:var(--mono);font-size:.52rem;color:var(--muted);">Q${globalQ}/${allQs}</div>
        </div>
        <div style="font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:6px;">${conv.context}</div>
        ${speakersHtml}
        ${graphicHtml}
        <div class="lt-audio-center" style="margin-bottom:14px;">${audioHtml}</div>
        <div style="font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.4;">${q.q}</div>
        <div class="lt-opts-grid">${optsHtml}</div>
        ${feedbackHtml}
      </div>
    </div>
    <div class="lt-nav">
      <button class="lt-btn-nav" onclick="lt3PrevQ()" ${prevDisabled}>← Précédent</button>
      <span style="font-family:var(--mono);font-size:.65rem;color:var(--muted)">Conv. ${lt3.convIdx+1} · Q${lt3.qIdx+1}</span>
      ${nextHtml}
    </div>
    <div style="text-align:center;margin-top:8px;">
      <span onclick="lt3Reset()" style="font-family:var(--mono);font-size:.56rem;color:var(--muted);cursor:pointer;text-decoration:underline;">Réinitialiser</span>
    </div>`;

  return wrap;
}

// QUIZ
// ═══════════════════════════════════════════════════════════
function startQuiz(source){
  const q=revQueue(source);
  if(!q.length){toast('Rien à réviser !');return;}
  S.quiz={queue:q,idx:0,results:[],answered:false,input:'',source};

}
function startFull(){
  S.quiz={queue:fullQueue('all'),idx:0,results:[],answered:false,input:'',source:'full'};
  render();
}

const _OK_MSGS = [
  '🎉 Excellent !', '✅ Parfait !', '🔥 En feu !', '💪 Bien joué !',
  '🌟 Bravo !', '🚀 Super !', '👏 Nickel !', '😎 Top !',
  '🏆 Correct !', '⚡ Impressionnant !', '🎯 Dans le mille !', '💡 Exactement !',
];
function _randomOk() {
  return _OK_MSGS[Math.floor(Math.random() * _OK_MSGS.length)];
}

function buildQuiz(){
  const q=S.quiz;
  if(q.idx>=q.queue.length) return buildResults();
  const item=q.queue[q.idx];
  const ans=q.answered, isOk=ans&&q.results[q.idx];
  const isPrep=item._sec==='prep';
  const dots=q.queue.map((_,i)=>{
    let c='dot';
    if(i<q.idx) c+=q.results[i]?' ok':' fail';
    if(i===q.idx) c+=' curr';
    return `<div class="${c}"></div>`;
  }).join('');

  // For preps: show FR usage type → write EN preposition
  // For vocab/expr: show FR → write EN
  const promptLabel = isPrep ? 'Écris la préposition anglaise →' : 'Traduis en anglais →';
  const promptWord  = isPrep ? `${item.fr}<br><span style="font-size:.75rem;color:var(--muted);font-style:italic;font-weight:400">${item.exampleTrad||''}</span>` : item.fr;
  const catLabel    = isPrep ? `📐 ${item.section}` : item._sec==='vocab'?'📚 Vocabulaire':'💬 Expression';
  const hint        = isPrep ? `<div class="quiz-hint">Exemple : <em>${item.example||''}</em></div>` : '';

  const wrap=document.createElement('div');
  wrap.className='review-section fade-up';
  wrap.innerHTML=`
    <div class="quiz-top">
      <div class="quiz-ctr">Question ${q.idx+1} / ${q.queue.length}</div>
      <button class="btn-quit" onclick="quitQuiz()">✕ Quitter</button>
    </div>
    <div class="quiz-dots">${dots}</div>
    <div class="quiz-card">
      <div class="quiz-lbl">${promptLabel}</div>
      <div class="quiz-word">${promptWord}</div>
      <div class="quiz-cat">${catLabel}</div>
      <div class="quiz-audio-row">
        <button class="btn-audio" onclick="speak('${esc(item.fr)}','fr')">${spkSvg()} FR</button>
        ${ans?`<button class="btn-audio" onclick="speak('${esc(item.en)}','en')">${spkSvg()} EN</button>`:''}
      </div>
      ${ans?'':hint}
      <input class="quiz-input ${ans?(isOk?'ok':'fail'):''}"
        id="qinput" type="text"
        placeholder="Ta réponse en anglais..."
        value="${esc(q.input)}"
        ${ans?'readonly':''}
        oninput="S.quiz.input=this.value"
        onkeydown="if(event.key==='Enter'&&!S.quiz.answered)submitQ()"
      />
      <div class="quiz-feedback">
        ${ans?(isOk
          ?`<span class="fb-ok">${_randomOk()}</span>`
          :`<span class="fb-fail">✗ Incorrect —</span><span class="fb-ans">&nbsp;${item.en}</span>`):''}
      </div>
      ${ans && isOk && q.source === 'sr' ? `
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-sr btn-sr-ok" style="flex:1" onclick="srUpgradeGrade(1)"><span class="sr-lbl">🤔 Correct</span><span class="sr-due">${srDueLabel(srGetCard(item._sec,item._idx).interval||1)}</span></button>
        <button class="btn-sr btn-sr-easy" style="flex:1" onclick="srUpgradeGrade(2)"><span class="sr-lbl">😎 Facile</span><span class="sr-due">${srDueLabel(Math.round((srGetCard(item._sec,item._idx).interval||1)*srGetCard(item._sec,item._idx).easeFactor))}</span></button>
      </div>` : ''}
      <div class="quiz-btns">
        ${!ans
          ?`<button class="btn-q prim" onclick="submitQ()">Valider ↵</button>`
          :`<button class="btn-q prim" onclick="nextQ()">${q.idx+1>=q.queue.length?'Voir les résultats 🏆':'Suivant →'}</button>`
        }
      </div>
      ${!ans?`<button class="btn-skip" onclick="skipQ()">Passer ce mot →</button>`:''}
    </div>`;
  setTimeout(()=>{const i=document.getElementById('qinput');if(i&&!ans)i.focus();},40);
  return wrap;
}

function srUpgradeGrade(grade) {
  const q = S.quiz;
  const item = q.queue[q.idx];
  srRate(item._sec, item._idx, grade);
  
  render();
}

function buildResults(){
  const q=S.quiz;
  const total=q.results.length, ok=q.results.filter(Boolean).length, fail=total-ok;
  const pct=total?Math.round((ok/total)*100):0;
  let em='😅',ti='Continue !',su='Quelques erreurs — retente !';
  if(pct>=90){em='🏆';ti='Excellent !';su='Quasi parfait, bravo !';}
  else if(pct>=70){em='💪';ti='Bien joué !';su='Encore quelques à consolider.';}
  else if(pct>=50){em='📈';ti='En progrès !';su='La moitié réussie — continue !';}
  const wrap=document.createElement('div');
  wrap.className='review-section fade-up';
  wrap.innerHTML=`
    <div class="quiz-results">
      <div class="res-emoji">${em}</div>
      <div class="res-title">${ti}</div>
      <div class="res-sub">${su}</div>
      <div class="res-scores">
        <div class="res-score ok"><div class="n">${ok}</div><div class="l">Corrects</div></div>
        <div class="res-score fail"><div class="n">${fail}</div><div class="l">Erreurs</div></div>
        <div class="res-score"><div class="n">${pct}%</div><div class="l">Score</div></div>
      </div>
      <div class="res-btns">
        <button class="btn-res prim" onclick="retryFail()">🔄 Refaire les erreurs</button>
        <button class="btn-res sec" onclick="quitQuiz()">← Retour</button>
      </div>
    </div>`;
  return wrap;
}

function submitQ(){
  const q=S.quiz; if(q.answered)return;
  const inp=document.getElementById('qinput');
  const val=(inp?inp.value:q.input).trim();
  if(!val){toast('Entre une réponse !');return;}
  const item=q.queue[q.idx];
  const isOk=checkAns(val,item.en);
  q.results[q.idx]=isOk; q.answered=true;
  if(isOk){
    S.streak++;
    // For SR quiz: grade=1 (Correct); for normal quiz: use setS
    if (q.source === 'sr') {
      srRate(item._sec, item._idx, 1); // Correct
    } else {
      setS(item._sec,item._idx,'ok');
    }
    toast('✓ Bravo !');}
  else{
    S.streak=0;
    if (q.source === 'sr') {
      srRate(item._sec, item._idx, 0); // Hard
    } else {
      setS(item._sec,item._idx,'review');
    }
  }
  save(); render();
}

function retryFail(){
  const q=S.quiz;
  const failed=q.queue.filter((_,i)=>!q.results[i]);
  if(!failed.length){quitQuiz();return;}
  S.quiz={queue:shuffle(failed),idx:0,results:[],answered:false,input:'',source:q.source};
  render();
}

function buildMcqBlock(qcmData, answersKey, resetFn, answerFn, title, color) {
  const answers = S[answersKey] || {};
  const answered = Object.keys(answers).length;
  const correct  = Object.entries(answers).filter(([i,v])=>parseInt(v)===qcmData[i].ans).length;
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="mcq-score-bar">
      <div class="mcq-score-info">
        <h3>✅ QCM — ${title}</h3>
        <p>${answered} / ${qcmData.length} répondues · ${qcmData.length-answered} restantes</p>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="mcq-score-num" style="color:${color}">${answered>0?correct+'/'+answered:'—'}</div>
        ${answered>0?`<button class="btn-mcq-reset" onclick="${resetFn}()">🔄 Reset</button>`:''}
      </div>
    </div>
  `;
  const list = document.createElement('div');
  list.className = 'mcq-section';
  qcmData.forEach((q,qi) => {
    const chosen = answers.hasOwnProperty(qi) ? parseInt(answers[qi]) : null;
    const isAnswered = chosen !== null;
    const isCorrect  = chosen === q.ans;
    const card = document.createElement('div');
    card.className = 'mcq-card';
    card.innerHTML = `
      <div class="mcq-q">Q${qi+1}. ${q.q}</div>
      <div class="mcq-opts">
        ${q.opts.map((opt,oi)=>{
          let cls='mcq-opt';
          if(isAnswered){if(oi===q.ans)cls+=' correct';else if(oi===chosen&&!isCorrect)cls+=' wrong';}
          return `<button class="${cls}" ${isAnswered?'disabled':''} onclick="${answerFn}(${qi},${oi})">
            ${isAnswered?(oi===q.ans?'✓ ':oi===chosen&&!isCorrect?'✗ ':''):''}${opt}
          </button>`;
        }).join('')}
      </div>
      ${isAnswered?`<div class="mcq-feedback ${isCorrect?'ok':'fail'}">
        ${isCorrect
          ? `<span style="font-weight:700;">✓ Correct</span> — ${q.expl}`
          : `<div style="margin-bottom:6px;"><span style="font-weight:700;">✗ Incorrect</span> — bonne réponse : <strong style="color:#52b788;">"${q.opts[q.ans]}"</strong></div>
             <div style="font-size:.68rem;line-height:1.5;color:var(--text);background:var(--surface);border-radius:6px;padding:7px 10px;border-left:3px solid #52b788;">💡 ${q.expl}</div>`
        }
      </div>`:''}
    `;
    list.appendChild(card);
  });
  div.appendChild(list);
  return div;
}

    opts: ["when form water vapor", "form when water vapor", "form vapor water when", "vapor form when water"],

function buildGrammar6Section() {
  injectGrammar6CSS && injectGrammar6CSS();
  const answers = S.mcqAnswers6 || {};
  const answered = Object.keys(answers).length;
  const total = GRAMMAR6_QCM.length;
  const qi = S.grammar6cursor !== undefined ? S.grammar6cursor : 0;
  const done = answers[qi] !== undefined;
  const q = GRAMMAR6_QCM[qi];
  const userAns = answers[qi];
  const isCorrect = done && userAns === q.ans;
  const pct = Math.round((answered / total) * 100);

  // Check if all answered → show results
  if (answered === total && S.grammar6View === 'results') {
    return buildGrammar6Results();
  }

  const wrap = document.createElement('div');
  wrap.className = 'g6-page fade-up';

  // Header
  const letters = ['A','B','C','D'];

  // Build sentence with highlighted blank
  const displayQ = q.q.replace('______', `<span class="g6-blank ${done ? (isCorrect ? 'correct' : 'wrong') : ''}" id="g6blank">${done ? q.opts[q.ans] : '______'}</span>`);

  wrap.innerHTML = `
    <div class="g6-header">
      <div class="g6-tag">✏️ Sentence Completion</div>
      <div class="g6-progress-wrap">
        <div class="g6-progress-bar"><div class="g6-progress-fill" style="width:${pct}%"></div></div>
        <div class="g6-progress-label">${answered}/${total}</div>
      </div>
    </div>

    <div class="g6-card">
      <div class="g6-qnum">Question ${qi + 1} sur ${total}</div>
      <div class="g6-sentence">${displayQ}</div>

      <div class="g6-opts">
        ${q.opts.map((opt, oi) => {
          let cls = '';
          if (done) {
            cls = 'disabled ';
            if (oi === q.ans) cls += 'reveal-correct';
            if (oi === userAns && userAns !== q.ans) cls += 'selected-wrong';
            if (oi === userAns && userAns === q.ans) cls += 'selected-correct';
          }
          return `
            <div class="g6-opt ${cls}" onclick="${done ? '' : `answerG6(${qi},${oi})`}">
              <div class="g6-opt-letter">${letters[oi]}</div>
              <div class="g6-opt-text">${opt}</div>
            </div>`;
        }).join('')}
      </div>

      <div class="g6-explanation ${done ? 'visible' : ''}">
        <div class="g6-exp-label">💡 Explication</div>
        ${q.exp}
      </div>
    </div>

    <div class="g6-nav">
      <button class="g6-btn-nav" onclick="g6Nav(-1)" ${qi === 0 ? 'disabled' : ''}>← Précédent</button>
      <span style="font-family:var(--mono);font-size:.65rem;color:var(--muted)">${qi+1} / ${total}</span>
      ${qi < total - 1
        ? `<button class="g6-btn-nav primary" onclick="g6Nav(1)">Suivant →</button>`
        : answered === total
          ? `<button class="g6-btn-nav primary" onclick="showG6Results()">Voir les résultats →</button>`
          : done
            ? `<button class="g6-btn-nav primary" onclick="showG6Results()">Voir les résultats →</button>`
            : `<button class="g6-btn-nav" onclick="goHome()">🏠 Accueil</button>`
      }
    </div>

    ${answered > 0 && answered < total && qi === total - 1 && answered < total ? '' : ''}
    ${answered > 0 ? `
      <div style="text-align:center;margin-top:16px;">
        <button onclick="resetG6()" style="font-family:var(--mono);font-size:.6rem;color:var(--muted);
          background:none;border:none;cursor:pointer;text-decoration:underline;">
          Recommencer depuis le début
        </button>
      </div>` : ''}
  `;
  return wrap;
}

function buildGrammar6Results() {
  const answers = S.mcqAnswers6 || {};
  const total = GRAMMAR6_QCM.length;
  const correct = GRAMMAR6_QCM.filter((q, i) => answers[i] === q.ans).length;
  const pct = Math.round((correct / total) * 100);
  const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '💪' : '📖';

  const wrap = document.createElement('div');
  wrap.className = 'g6-page fade-up';
  wrap.innerHTML = `
    <div class="g6-header">
      <div class="g6-tag">✏️ Sentence Completion</div>
      <div class="g6-tag" style="background:rgba(45,106,79,.08);border-color:rgba(45,106,79,.3);color:#2d6a4f">Résultats</div>
    </div>
    <div class="g6-score-card">
      <div style="font-size:2.5rem;margin-bottom:8px">${emoji}</div>
      <div class="g6-score-big">${correct} / ${total}</div>
      <div class="g6-score-sub">${pct}% de bonnes réponses</div>
      <div class="g6-score-bar-wrap">
        <div class="g6-score-bar-fill" style="width:${pct}%"></div>
      </div>
      <button class="g6-btn-nav primary" onclick="resetG6()" style="margin:0 auto">🔄 Recommencer</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">

        return `

            border-radius:12px;padding:14px 16px;">
            <div style="font-family:var(--mono);font-size:.55rem;color:${ok?'#2d6a4f':'#c1121f'};
              text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">
              Q${i+1} — ${ok?'✓ Correct':'✗ Incorrect'}
            </div>
            <div style="font-size:.8rem;color:var(--text);margin-bottom:6px;font-weight:600">
              ${q.q.replace('______', `<strong style="color:${ok?'#2d6a4f':'#c1121f'}">${q.opts[q.ans]}</strong>`)}
            </div>
            ${!ok ? `<div style="font-size:.75rem;color:var(--muted)">Ta réponse : <em>${q.opts[ua]??'—'}</em></div>` : ''}
          </div>`;
      }).join('')}
    </div>
  `;
  return wrap;
}

function answerG6(qi, oi) {

function renderSpeakFeedback(fb, original) {
  const isSame = fb.corrected && fb.corrected.trim().toLowerCase() === original.trim().toLowerCase();
  const score = fb.score || 0;
  const scoreColor = score >= 8 ? '#2d6a4f' : score >= 5 ? '#b45309' : '#c1121f';
  const errors = fb.errors || [];

  return `
    <div class="speak-feedback-card">
      <div class="sfb-row">
        <div class="sfb-label">✏️ Version corrigée</div>
        <div class="sfb-corrected ${isSame ? 'same' : ''}">${isSame ? '✓ Pas de correction nécessaire !' : fb.corrected}</div>
      </div>

      ${errors.length > 0 ? `
        <div class="sfb-row">
          <div class="sfb-label">⚠️ Points à corriger</div>
          <div class="sfb-errors">
            ${errors.map(e => `<div class="sfb-error-item">→ ${e}</div>`).join('')}
          </div>
        </div>
      ` : ''}

      <div class="sfb-row">
        <div class="sfb-label">💡 Conseil</div>
        <div class="sfb-tip">${fb.tip || '—'}</div>
      </div>

      <div class="sfb-row">
        <div class="sfb-label">🎯 Score</div>
        <div class="speak-score">
          <div class="speak-score-num" style="color:${scoreColor}">${score}/10</div>
          <div class="speak-score-bar-wrap">
            <div class="speak-score-fill" style="width:${score*10}%;background:${scoreColor}"></div>
          </div>
        </div>
      </div>

      <div class="speak-btn-row">
        <button class="btn-speak-again" onclick="resetSpeak()">🎤 Réessayer</button>
        ${!isSame ? `<button class="btn-speak-play" onclick="speak('${esc(fb.corrected)}','en')">${spkSvg()} Écouter la correction</button>` : ''}
      </div>
    </div>
  `;
}

function toggleRecording() {
  if (_isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('🚫 Micro non supporté sur ce navigateur'); return; }

  _recognition = new SR();
  _recognition.lang = 'en-US';
  _recognition.continuous = false;
  _recognition.interimResults = true;

  _recognition.onstart = () => {
    _isRecording = true;
    const btn = document.getElementById('btnMic');
    const status = document.getElementById('micStatus');
    if (btn) { btn.classList.add('recording'); btn.textContent = '⏹'; }
    if (status) { status.textContent = 'ÉCOUTE EN COURS...'; status.classList.add('active'); }
  };

  _recognition.onresult = (event) => {
    const interim = Array.from(event.results).map(r => r[0].transcript).join('');
    const el = document.getElementById('speakTranscript');
    if (el) { el.textContent = interim; el.classList.add('has-text'); }
    if (event.results[0].isFinal) {
      S.speak.transcript = interim;
    }
  };

  _recognition.onerror = (e) => {
    _isRecording = false;
    toast('❌ Erreur micro : ' + e.error);
    render();
  };

  _recognition.onend = () => {
    _isRecording = false;
    if (S.speak.transcript) {
      callClaudeForFeedback(S.speak.transcript);
    } else {
      render();
    }
  };

  _recognition.start();
}

function stopRecording() {
  if (_recognition) {
    _recognition.stop();
  }
}

// ── OFFLINE GRAMMAR ENGINE ──────────────────────────────────
GRAMMAR_RULES = [
  // Subject-verb agreement (3rd person)
  { re:/\b(he|she|it)\s+don't\b/gi,          fix:(m,s)=>m.replace(/don't/i,"doesn't"),       msg:"3ème personne : utilise \"doesn't\" avec he/she/it" },

  { re:/\b(he|she|it)\s+do\b(?!\s+not)/gi,   fix:(m,s)=>m.replace(/\bdo\b/i,"does"),          msg:"3ème personne : \"he/she/it does\"" },
  { re:/\b(he|she|it)\s+go\b/gi,             fix:(m,s)=>m.replace(/\bgo\b/i,"goes"),          msg:"3ème personne : \"he/she/it goes\"" },
  { re:/\b(he|she|it)\s+work\b/gi,           fix:(m,s)=>m.replace(/\bwork\b/i,"works"),       msg:"3ème personne : ajoute -s au verbe (works)" },
  { re:/\b(he|she|it)\s+come\b/gi,           fix:(m,s)=>m.replace(/\bcome\b/i,"comes"),       msg:"3ème personne : \"he/she/it comes\"" },
  { re:/\b(he|she|it)\s+say\b/gi,            fix:(m,s)=>m.replace(/\bsay\b/i,"says"),         msg:"3ème personne : \"he/she/it says\"" },
  { re:/\b(he|she|it)\s+find\b/gi,           fix:(m,s)=>m.replace(/\bfind\b/i,"finds"),       msg:"3ème personne : \"he/she/it finds\"" },
  { re:/\b(he|she|it)\s+need\b/gi,           fix:(m,s)=>m.replace(/\bneed\b/i,"needs"),       msg:"3ème personne : \"he/she/it needs\"" },
  { re:/\b(he|she|it)\s+know\b/gi,           fix:(m,s)=>m.replace(/\bknow\b/i,"knows"),       msg:"3ème personne : \"he/she/it knows\"" },

  // False friends & common French mistakes
  { re:/\bI am agree\b/gi,                   fix:()=>"I agree",                               msg:"\"I am agree\" n'existe pas → \"I agree\"" },
  { re:/\bI am disagree\b/gi,                fix:()=>"I disagree",                            msg:"\"I am disagree\" n'existe pas → \"I disagree\"" },
  { re:/\bmake a research\b/gi,              fix:()=>"do research",                           msg:"\"research\" est indénombrable → \"do research\"" },
  { re:/\bdo a mistake\b/gi,                 fix:()=>"make a mistake",                        msg:"On \"makes\" une erreur, pas \"does\"" },
  { re:/\bdid a mistake\b/gi,                fix:()=>"made a mistake",                        msg:"On \"makes\" une erreur → passé : \"made a mistake\"" },
  { re:/\bmake a travel\b/gi,                fix:()=>"travel / take a trip",                  msg:"\"travel\" est un verbe ou indénombrable → \"travel\" ou \"take a trip\"" },
  { re:/\bI have \d+ years\b/gi,             fix:(m)=>m.replace(/I have/i,"I am"),            msg:"Pour l'âge : \"I am X years old\" (pas \"I have\")" },
  { re:/\bvery goodly\b/gi,                  fix:()=>"very well",                             msg:"\"Goodly\" n'existe pas → \"very well\"" },
  { re:/\bI am boring\b/gi,                  fix:()=>"I am bored",                            msg:"\"boring\" = ennuyeux (chose), \"bored\" = qui s'ennuie (personne)" },
  { re:/\bI am very interesting\b/gi,        fix:()=>"I find it very interesting",            msg:"\"interesting\" décrit une chose, \"interested\" décrit une personne" },

  // Uncountable nouns (fréquent en QA/business)
  { re:/\binformations\b/gi,                 fix:()=>"information",                           msg:"\"information\" est indénombrable, pas de -s" },
  { re:/\badvices\b/gi,                      fix:()=>"advice",                                msg:"\"advice\" est indénombrable, pas de -s" },
  { re:/\bfeedbacks\b/gi,                    fix:()=>"feedback",                              msg:"\"feedback\" est indénombrable, pas de -s" },
  { re:/\bknowledges\b/gi,                   fix:()=>"knowledge",                             msg:"\"knowledge\" est indénombrable, pas de -s" },
  { re:/\bprogresss\b/gi,                    fix:()=>"progress",                              msg:"\"progress\" est indénombrable, pas de -s" },
  { re:/\bresearchs\b/gi,                    fix:()=>"research",                              msg:"\"research\" est indénombrable, pas de -s" },
  { re:/\bequipments\b/gi,                   fix:()=>"equipment",                             msg:"\"equipment\" est indénombrable, pas de -s" },

  // Article errors (common for French speakers)
  { re:/\bsince \d+ (day|week|month|year)s?\b/gi, fix:(m)=>{ if(!/since \d/.test(m)) return m; return m.replace(/since (\d+)/i,'for $1'); }, msg:"\"since\" + point précis, \"for\" + durée (for 3 days)" },

  // Tense & auxiliary errors
  { re:/\bI have went\b/gi,                  fix:()=>"I have gone / I went",                  msg:"Participe passé de go = \"gone\" (I have gone) ou prétérit \"I went\"" },
  { re:/\bI have saw\b/gi,                   fix:()=>"I have seen",                           msg:"Participe passé de see = \"seen\" → I have seen" },
  { re:/\bI have did\b/gi,                   fix:()=>"I have done",                           msg:"Participe passé de do = \"done\" → I have done" },
  { re:/\bI have came\b/gi,                  fix:()=>"I have come",                           msg:"Participe passé de come = \"come\" → I have come" },
  { re:/\bI have taked\b/gi,                 fix:()=>"I have taken",                          msg:"Participe passé de take = \"taken\" → I have taken" },
  { re:/\bdid you\s+\w+ed\b/gi,             fix:(m)=>m.replace(/(\w+)ed$/i,(v)=>v.replace(/ed$/,'')), msg:"Après did, utilise la base verbale (did you find?, pas did you found?)" },
  { re:/\bwould can\b/gi,                    fix:()=>"would be able to",                      msg:"Deux modaux ne se combinent pas → \"would be able to\"" },

  // QA-specific vocabulary errors
  { re:/\bI tested the application and there (is|was) a problem\b/gi, fix:(m)=>m.replace(/problem/i,'issue/bug'), msg:"En QA : préfère \"issue\" ou \"bug\" à \"problem\"" },
  { re:/\bthe bug is not working\b/gi,       fix:()=>"the feature is not working",            msg:"Le bug ne \"marche pas\", c'est la fonctionnalité qui ne fonctionne pas" },
  { re:/\bI will\s+(\w+)\s+it tomorrow\b/gi, fix:(m)=>m,                                     msg:"Bonne utilisation de will pour le futur ✓" },

  // Preposition errors
  { re:/\bdepend of\b/gi,                    fix:()=>"depend on",                             msg:"\"depend\" se construit avec \"on\" → depend on" },
  { re:/\bsimilar of\b/gi,                   fix:()=>"similar to",                            msg:"\"similar\" se construit avec \"to\" → similar to" },
  { re:/\binterested to\b(?!\s+(?:know|learn|see|find|hear))/gi, fix:()=>"interested in",    msg:"\"interested\" se construit avec \"in\" → interested in" },
  { re:/\bgood in\b/gi,                      fix:()=>"good at",                               msg:"\"good\" se construit avec \"at\" → good at something" },
  { re:/\barrived to\b/gi,                   fix:()=>"arrived at/in",                         msg:"\"arrived\" + at (endroit précis) ou in (ville/pays)" },
  { re:/\bexplain me\b/gi,                   fix:()=>"explain to me",                         msg:"\"explain\" a besoin de \"to\" → explain to me" },

  // Word order
  { re:/\bI too am\b/gi,                     fix:()=>"I am too",                              msg:"Ordre des mots : \"I am too\" (pas \"I too am\")" },
  { re:/\balways I\b/gi,                     fix:()=>"I always",                              msg:"Les adverbes de fréquence se placent avant le verbe principal" },
  { re:/\bever I\b/gi,                       fix:()=>"I ever",                                msg:"Ordre des mots : sujet + adverbe + verbe" },
];

// Tips pool by error category
const TIPS_POOL = {
  agreement: "Mémo : he/she/it → toujours un -s ou -es sur le verbe au présent simple.",
  uncountable: "Astuce : information, advice, feedback, equipment → jamais de -s en anglais.",
  falseFriend: "Attention aux faux-amis : traduis le sens, pas le mot français mot à mot.",
  preposition: "Les prépositions s'apprennent par cœur avec le verbe : depend ON, good AT, similar TO.",
  tense: "Pour le present perfect : have/has + participe passé (gone, seen, done, taken...).",
  general: "Parle en phrases complètes avec sujet + verbe + complément pour être plus clair.",
};

function offlineAnalyze(text) {
  let corrected = text;
  const errors = [];
  let errorCategories = new Set();

  GRAMMAR_RULES.forEach(rule => {
    if (rule.re.test(corrected)) {
      const before = corrected;
      corrected = corrected.replace(rule.re, rule.fix);
      rule.re.lastIndex = 0; // reset stateful regex
      if (corrected !== before || rule.re.test(text)) {
        errors.push(rule.msg);
        // detect category
        if (rule.msg.includes('3ème personne')) errorCategories.add('agreement');
        else if (rule.msg.includes('indénombrable')) errorCategories.add('uncountable');
        else if (rule.msg.includes('faux')) errorCategories.add('falseFriend');
        else if (rule.msg.includes('préposition') || ['on','at','in','to'].some(p=>rule.msg.includes('"'+p+'"'))) errorCategories.add('preposition');
        else if (rule.msg.includes('participe') || rule.msg.includes('passé')) errorCategories.add('tense');
      }
    }
    rule.re.lastIndex = 0;
  });

  // Length / fluency check
  const wordCount = text.trim().split(/\s+/).length;
  if (wordCount < 4) {
    errors.push("Essaie de parler en phrases complètes (sujet + verbe + complément)");
    errorCategories.add('general');
  }

  // Pick most relevant tip
  const cat = [...errorCategories][0] || 'general';
  const tip = TIPS_POOL[cat];

  // Score : start at 10, -1.5 per error, min 2
  const score = Math.max(2, Math.round(10 - errors.length * 1.5));

  return { corrected, errors, tip, score };
}

function callClaudeForFeedback(text) {
  S.speak.loading = true;
  S.speak.feedback = null;
  render();

  // Small delay to show loading state
  setTimeout(() => {
    const fb = offlineAnalyze(text);
    S.speak.feedback = fb;
    S.speak.loading = false;
    if (fb.errors.length === 0) { S.streak++; save(); }
    render();
  }, 600);
}

function resetSpeak() {
  S.speak.transcript = '';
  S.speak.feedback = null;
  S.speak.loading = false;
  render();
}

function nextSpeakPrompt() {
  S.speak.promptIdx = (S.speak.promptIdx + 1) % SPEAK_PROMPTS.length;
  resetSpeak();
}

// ── Start a session ────────────────────────────────────────
function startSession(moduleKey, startPos, skipBatch, origin) {
  const cfg  = SESS_CFG[moduleKey];
  const data = cfg.getData();
  const total = data.length;

  if (startPos >= total) startPos = 0;

  const batchEnd = Math.min(startPos + BATCH_SIZE, total);
  const batch = [];
  for (let i = startPos; i < batchEnd; i++) {
    batch.push({ ...data[i], _sec: moduleKey, _idx: i });
  }

  S.session = {
    moduleKey,
    type: cfg.type,
    color: cfg.color,
    label: cfg.label,
    batch,
    batchStart: startPos,
    batchEnd,
    totalItems: total,
    cardIdx: 0,            // position in current batch
    answers: {},           // idx→ {chosen, correct} for MCQ / {val} for FC
    showRecap: false,
    showErrors: false,
  };

  // Save resume position (will be updated as we go)
  S.sessProgress[moduleKey] = { pos: startPos };
  save();

  S.tab = 'session';
  const bar = document.getElementById('backBar');
  bar.style.display = 'flex';
  const _origin = origin || null;
  bar.onclick = () => {
    S.session = null;
    if (_origin === 'home') { goHome(); }
    else if (_origin) { switchTab(_origin); }
    else { S.tab = moduleKey; render(); }
  };
  render();
}

// ── Main session screen dispatcher ────────────────────────
function buildSessionScreen() {
  const sess = S.session;
  if (!sess) { goHome(); return document.createElement('div'); }
  if (sess.showRecap) return buildSessionRecap();
  return buildSessionCard();
}

// ── Flashcard card ─────────────────────────────────────────
function buildFcCard(item, cardIdx, answered, color) {
  const sess = S.session;
  const ans = sess.answers[cardIdx];
  const val = ans ? ans.val : null;  // 0=Hard, 1=Correct, 2=Easy

  const isPrep   = item._sec === 'prep';
  const word     = item.en;
  const trad     = item.fr;
  const extra    = item.extra  || item.fr;
  const example  = item.example || item.ex || '';
  const exTrad   = item.exampleTrad || item.exTrad || '';

  // SR interval preview for each button
  const srPreview = (grade) => {
    const card = srGetCard(item._sec, item._idx);
    let { interval, easeFactor, reps } = card;
    const q = grade === 0 ? 2 : grade === 1 ? 4 : 5;
    if (q < 3) { interval = 1; }
    else {
      if (reps === 0)      interval = 1;
      else if (reps === 1) interval = 6;
      else                 interval = Math.round(interval * easeFactor);
    }
    return srDueLabel(interval);
  };

  const div = document.createElement('div');

  const cardCls = val === 2 ? 'is-ok' : val === 1 ? 'is-ok' : val === 0 ? 'is-rev' : '';

    const panelMsg = isHard  ? 'Lis l\'exemple à voix haute pour ancrer le sens.' : isOk ? 'Tu y es presque. Revois dans quelques jours.' : 'Parfait. Passe à la suite.';

    const exBlock = example ? `
      <div style="margin-top:10px;padding:10px 12px;background:var(--bg2);border-radius:8px;border-left:3px solid ${panelClr};">
        <div style="font-family:var(--mono);font-size:.52rem;color:${panelClr};text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px;">Exemple en contexte</div>
        <div style="display:flex;align-items:flex-start;gap:7px;">
          <button class="btn-audio" onclick="speak('${esc(example)}','en')" style="border-color:${panelClr}33;color:${panelClr};flex-shrink:0;margin-top:1px;">${spkSvg()}</button>
          <div>
            <div style="font-size:.82rem;font-weight:600;color:var(--text);line-height:1.5;">"${example}"</div>
            ${exTrad ? `<div style="font-size:.75rem;color:var(--muted);font-style:italic;margin-top:3px;">${exTrad}</div>` : ''}
          </div>
        </div>
      </div>` : '';

    // Dialog block — only for vocab/expr
    const dialogBlock = (item._sec === 'vocab' || item._sec === 'expr')
      ? renderDialogBlock(item, panelClr)
      : '';

    return `
      <div style="background:${panelBg};border:1.5px solid ${panelBdr};border-radius:14px;padding:14px 16px;margin-top:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <span style="font-weight:800;font-size:.82rem;color:${panelClr};">${panelLbl}</span>
          <span style="font-family:var(--mono);font-size:.55rem;color:var(--muted);">→ ${srPreview(val)}</span>
        </div>

          ${example && !isPrep ? `<button class="btn-audio" onclick="speak('${esc(example)}','en')">${spkSvg()} Exemple</button>` : ''}
        </div>
      </div>

    <div class="sess-sr-actions">

function sessMarkSR(cardIdx, grade) {
  const sess = S.session;
  const item = sess.batch[cardIdx];
  const prev = sess.answers[cardIdx];
  // Toggle: click same grade = unmark
  const newVal = (prev && prev.val === grade) ? null : grade;
  if (newVal !== null) {
    const { interval } = srRate(item._sec, item._idx, grade);
    sess.answers[cardIdx] = { val: grade, correct: grade > 0 };
    if (grade > 0) { S.streak++; save(); checkMilestones(null); }
    else { S.streak = 0; save(); }
    trackAction();
    // Trigger dialog generation for vocab/expr only
    if ((item._sec === 'vocab' || item._sec === 'expr') && !DIALOGS_CACHE[dialogKey(item)]) {
      generateDialog(item);
    }
  } else {
    delete sess.answers[cardIdx];
    // Undo: remove SR data and status
    delete S.sr[srKey(item._sec, item._idx)];
    S.status[srKey(item._sec, item._idx)] = null;
    save();
  }
  render();
}

// ── MCQ card ───────────────────────────────────────────────
function buildMcqCard(item, cardIdx, answered, color) {
  const sess   = S.session;
  const ans    = sess.answers[cardIdx];
  const chosen = ans ? ans.chosen : null;
  const isCorrect = ans ? ans.correct : false;

  const div = document.createElement('div');
  div.className = 'sess-mcq-card';

  div.innerHTML = `
    <div class="sess-mcq-q">Q${item._idx+1}. ${item.q}</div>
    <div class="sess-mcq-opts">
      ${item.opts.map((opt, oi) => {
        let cls = 'sess-mcq-opt';
        if (answered) {
          if (oi === item.ans) cls += ' correct';
          else if (oi === chosen && !isCorrect) cls += ' wrong';
        }
        return `<button class="${cls}" ${answered?'disabled':''} onclick="sessMcqAnswer(${cardIdx},${oi},${item.ans})">
          ${answered ? (oi===item.ans ? '✓ ' : oi===chosen&&!isCorrect ? '✗ ' : '  ') : ''}${opt}
        </button>`;
      }).join('')}
    </div>
    ${answered ? `
      <div class="sess-mcq-expl ${isCorrect?'ok':'fail'}">
        ${isCorrect
          ? `<span style="font-weight:700;">✓ Correct</span> — ${item.expl}`
          : `<div style="margin-bottom:8px;"><span style="font-weight:700;">✗ Incorrect</span> — la bonne réponse est <strong style="color:#2d6a4f;">"${item.opts[item.ans]}"</strong></div>
             <div style="font-size:.7rem;line-height:1.5;color:var(--text);background:var(--bg2);border-radius:6px;padding:8px 10px;border-left:3px solid #52b788;">
               💡 ${item.expl}
             </div>`
        }
      </div>` : ''}

    <button class="btn-sess-next" ${answered?'':'disabled'} onclick="sessNext()">
      ${cardIdx+1 >= sess.batch.length ? '🏁 Voir le récap →' : 'Suivant →'}
    </button>
  `;

  return div;
}

function sessMcqAnswer(cardIdx, chosen, correctAns) {
  const sess = S.session;
  if (sess.answers.hasOwnProperty(cardIdx)) return; // already answered
  const isCorrect = chosen === correctAns;
  sess.answers[cardIdx] = { chosen, correct: isCorrect };

  // Persist into the right mcqAnswers key
  const cfg = SESS_CFG[sess.moduleKey];
  const item = sess.batch[cardIdx];
  if (cfg.answersKey) {
    if (!S[cfg.answersKey]) S[cfg.answersKey] = {};
    S[cfg.answersKey][item._idx] = chosen;
  }

  if (isCorrect) { S.streak++; save(); checkMilestones(null); }
  trackAction();
  render();
}

// ── Navigate between cards ─────────────────────────────────
function sessNext() {
  const sess = S.session;
  if (sess.cardIdx + 1 >= sess.batch.length) {
    // End of batch → show recap
    const nextPos = sess.batchEnd;
    S.sessProgress[sess.moduleKey] = { pos: nextPos };
    // Record last session for smart CTA
    S.lastSession = { moduleKey: sess.moduleKey, pos: nextPos, ts: Date.now() };
    trackLot();
    save();
    sess.showRecap = true;
    // Check milestones after lot complete (deferred so recap renders first)
    setTimeout(() => checkMilestones(sess.moduleKey), 600);
    render();
  } else {
    sess.cardIdx++;
    render();
  }
}

function sessionPause() {
  // Save current position and go back to launcher
  const sess = S.session;
  if (sess) {
    const pausePos = sess.batchStart + sess.cardIdx;
    S.sessProgress[sess.moduleKey] = { pos: pausePos };
    // Record last session for smart CTA (paused mid-batch)
    S.lastSession = { moduleKey: sess.moduleKey, pos: pausePos, ts: Date.now() };
    save();
  }
  S.tab = sess ? sess.moduleKey : 'home';
  S.session = null;
  render();
}

// ── Recap screen ───────────────────────────────────────────
function buildSessionRecap() {
  const sess = S.session;
  const { batch, answers, color, label, moduleKey, batchStart, batchEnd, totalItems, type } = sess;

  const total = batch.length;
  const correct = Object.values(answers).filter(a => a.correct).length;
  const wrong   = total - correct;
  const pct     = total > 0 ? Math.round((correct / total) * 100) : 0;
  if (pct >= 90) { em='🏆'; ti='Excellent !'; sub='Quasi parfait !'; }
  else if (pct >= 70) { em='💪'; ti='Bien joué !'; sub='Encore quelques à consolider.'; }
  else if (pct >= 50) { em='📈'; ti='En progrès !'; sub='La moitié réussie — continue !'; }

  // XP calculation
  const xp = correct * 10 + (pct >= 90 ? 50 : pct >= 70 ? 25 : 0);

  // Fire confetti for good performance
  if (pct >= 70) setTimeout(() => launchConfetti(pct >= 90 ? 120 : 60), 200);

  // Collect errors
  const errors = batch.map((item, i) => {
    const a = answers[i];
    if (!a || a.correct) return null;
    return { item, i, ans: a };
  }).filter(Boolean);

  const nextPos = batchEnd;
  const hasMore = nextPos < totalItems;
  const batchNum   = Math.floor(batchStart / BATCH_SIZE) + 1;
  const batchTotal = Math.ceil(totalItems / BATCH_SIZE);

  const wrap = document.createElement('div');
  wrap.className = 'session-page fade-up';

  wrap.innerHTML = `
    <div class="sess-recap">
      <div class="recap-celebration">
        <span class="big-emoji">${em}</span>
        <div class="cele-title" style="color:${color}">${ti}</div>
        <div class="cele-sub">${sub}</div>
        ${pct >= 70 ? `<div class="cele-xp">+${xp} XP</div>` : ''}
        <div style="font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:10px;letter-spacing:1px;">Lot ${batchNum}/${batchTotal} — ${label}</div>
      </div>

      <div class="sess-recap-scores">
        <div class="sess-score-chip ok"><span class="n">${correct}</span><span class="l">${type==='fc'?'Maîtrisés':'Corrects'}</span></div>
        <div class="sess-score-chip fail"><span class="n">${wrong}</span><span class="l">Erreurs</span></div>
        <div class="sess-score-chip pct"><span class="n">${pct}%</span><span class="l">Score</span></div>
      </div>

      ${errors.length > 0 ? `
        <button class="sess-errors-toggle" id="errToggle" onclick="sessToggleErrors()">
          👁 Voir les ${errors.length} erreur${errors.length>1?'s':''} du lot
        </button>
        <div id="sessErrorList" style="display:none;">
          <div class="sess-errors-list">
            ${errors.map(({item, i, ans}) => {
              const isFC = type === 'fc';
              const wrongLabel = isFC
                ? (ans.val === 0 ? '😓 Marqué Difficile' : '— pas répondu')
                : `✗ Tu as choisi : "${item.opts[ans.chosen]}"`;
              const correctLabel = isFC
                ? `✓ Repassera dans 1 jour`
                : `✓ Correct : "${item.opts[item.ans]}"`;
              return `
                <div class="sess-error-card">
                  <div class="ec-en">${item.en || item.q}</div>
                  <div class="ec-fr">${item.fr || ''}</div>
                  <div class="ec-expl">
                    <div>${wrongLabel}</div>
                    <div style="margin-top:4px;color:var(--accent2);">${correctLabel}</div>
                    ${item.expl ? `<div style="margin-top:4px;color:var(--muted);">💡 ${item.expl}</div>` : ''}
                    ${item.example ? `<div style="margin-top:4px;font-style:italic;">Ex : "${item.example}"</div>` : ''}
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>` : `
        <div style="text-align:center;padding:12px;font-family:var(--mono);font-size:.72rem;color:var(--accent2);background:rgba(45,106,79,.08);border-radius:10px;margin-bottom:8px;">
          🎉 Lot parfait — aucune erreur !
        </div>`}

      <div class="sess-recap-btns">
        ${hasMore ? `
          <button class="btn-recap prim" style="background:${color}" onclick="startSession('${moduleKey}', ${nextPos})">
            ▶ Lot suivant (${batchNum+1}/${batchTotal}) →
          </button>` : `
          <button class="btn-recap prim" style="background:${color}" disabled>
            🏆 Module terminé !
          </button>`}
        <button class="btn-recap sec" onclick="goHome()">🏠 Accueil</button>
        <button class="btn-recap restart" onclick="startSession('${moduleKey}', 0)">↺ Recommencer depuis le début</button>
      </div>

  `;

  return wrap;

function sessToggleErrors() {

// HELPERS
// ═══════════════════════════════════════════════════════════
function spkSvg(){return`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>`;}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function norm(s){return s.toLowerCase().replace(/[éèêë]/g,'e').replace(/[àâä]/g,'a').replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/[ç]/g,'c').replace(/[''`]/g,"'").replace(/\s+/g,' ').trim();}
function checkAns(inp,exp){
  const a=norm(inp),b=norm(exp);
  if(a===b)return true;
  // allow (verb) suffix in parens
  const bClean=b.replace(/\s*\(.*?\)/g,'').trim();
  if(a===bClean)return true;
  const wb=b.split(' '),wa=a.split(' ');
  if(wb.length>=3){const h=wb.filter(w=>wa.includes(w)).length;return h/wb.length>=0.75;}
  return false;
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const MILESTONE_DEFS = {
  firstLot: {
    emoji: '🚀', badge: 'Premier lot', badgeColor: '#2d6a4f',
    title: 'Tu es lancé !',
    sub: 'Premier lot terminé. La progression commence ici — chaque lot compte.',

    btn: 'Continuer le streak',
    confetti: 50,
  },
  streak10: {
    emoji: '⚡', badge: 'Streak x10', badgeColor: '#c1121f',
    title: '10 bonnes réponses d\'affilée',
    sub: 'Concentration maximale. Tu mérites cette pause.',
    btn: 'Continuer',
    confetti: 80,
  },
  streak20: {
    emoji: '👑', badge: 'Streak x20', badgeColor: '#7c3aed',
    title: '20 de suite. Impressionnant.',
    sub: 'C\'est le genre de séance dont on se souvient.',
    btn: 'Poursuivre',
    confetti: 140,
  },
};
// Module 100% milestones are generated dynamically

let _milestoneQueue = [];
let _milestoneOpen  = false;

function checkMilestones(moduleKey) {
  const toShow = [];

  // 1. Premier lot ever
  if (!S.milestones.firstLot && S.daily.lotsCompleted >= 1) {
    S.milestones.firstLot = true;
    toShow.push('firstLot');
  }

  // 2. Module à 100%
  if (moduleKey) {
    const milKey = `module_${moduleKey}`;
    if (!S.milestones[milKey]) {
      const cfg  = SESS_CFG[moduleKey];
      if (cfg) {
        const data = cfg.getData();
        const done = cfg.type === 'fc'
          ? data.filter((_,i) => getS(moduleKey, i) === 'ok').length
          : Object.keys(S[cfg.answersKey] || {}).length;
        if (done >= data.length) {
          S.milestones[milKey] = true;
          // Build a dynamic def for this module
          MILESTONE_DEFS[milKey] = {
            emoji: '🏆',
            badge: '100% complété',
            badgeColor: cfg.color || '#2d6a4f',
            title: `${cfg.label} — maîtrisé !`,
            sub: `Tu as parcouru les ${data.length} éléments de ce module. Un vrai acquis.`,
            btn: 'Continuer',
            confetti: 100,
          };
          toShow.push(milKey);
        }
      }
    }
  }

  // 3. Streak milestones
  [5, 10, 20].forEach(n => {
    const milKey = `streak${n}`;
    if (!S.milestones[milKey] && S.streak >= n) {
      S.milestones[milKey] = true;
      toShow.push(milKey);
    }
  });

  if (toShow.length > 0) {
    save();
    _milestoneQueue.push(...toShow);
    if (!_milestoneOpen) drainMilestoneQueue();
  }
}

function drainMilestoneQueue() {
  if (_milestoneQueue.length === 0) { _milestoneOpen = false; return; }
  _milestoneOpen = true;
  const key = _milestoneQueue.shift();
  const def = MILESTONE_DEFS[key];
  if (!def) { drainMilestoneQueue(); return; }
  showMilestone(def);
}

function showMilestone(def) {
  const modal = document.getElementById('milestoneModal');
  document.getElementById('mcEmoji').textContent  = def.emoji;
  document.getElementById('mcTitle').textContent  = def.title;
  document.getElementById('mcSub').textContent    = def.sub;
  document.getElementById('mcBtn').textContent    = def.btn;
  const badge = document.getElementById('mcBadge');
  badge.textContent    = def.badge;
  badge.style.color    = def.badgeColor;
  badge.style.borderColor = def.badgeColor;
  badge.style.background  = def.badgeColor + '18';
  document.getElementById('mcBtn').style.background = def.badgeColor;
  document.getElementById('mcBtn').style.color = '#fff';
  modal.classList.add('show');
  if (def.confetti) setTimeout(() => launchConfetti(def.confetti), 150);
}

function closeMilestone() {
  const modal = document.getElementById('milestoneModal');
  modal.classList.remove('show');
  setTimeout(() => drainMilestoneQueue(), 300);
}
